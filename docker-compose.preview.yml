# docker-compose.preview.yml — Preview Environments por Pull Request en Coolify (mismo servidor).
#
# NO es el despliegue de producción. Lo usa SOLO la aplicación «auditbrain-preview» del entorno
# `previews` de Coolify (build pack Docker Compose). Un preview = cinco servicios aislados por PR:
#   init     genera, una sola vez, la contraseña de Postgres y el secreto JWT en el volumen `secrets`
#   db       PostgreSQL 18 exclusivo del PR (sin puerto publicado; volumen `pgdata` del PR)
#   backend  FastAPI (APP_ENV=preview; arma DATABASE_URL desde el archivo de secretos)
#   consola  Command Center (nginx + dist de Vite)
#   clientes Portal de clientes (nginx + dist de Vite, incluye frontend-shared)
#
# Garantías de diseño (ver docs/previews-coolify.md):
# - Ninguna imagen se construye en el servidor: las tres propias vienen de GHCR etiquetadas con el
#   commit exacto del PR. La etiqueta es sha-${SOURCE_COMMIT} (obligatoria: `${VAR:?}` hace que
#   `docker compose` falle si falta o está vacía) y el backend verifica al arrancar que su
#   BUILD_COMMIT coincide con esa etiqueta; si no, no arranca.
# - Ningún secreto pasa por variables de Coolify ni por el repositorio. No se usa SERVICE_PASSWORD_*
#   porque Coolify lo comparte entre previews.
# - Ninguna variable apunta a producción (CORS vacío, portal centinela, DOCUMENT_SERVICE en sumidero).
# - Límites de memoria y CPU por servicio; oom_score_adj alto y cpu_shares bajos para que, ante
#   presión en el host compartido, el kernel sacrifique el preview antes que producción.
# - Concurrencia decidida por capacidad real del host (F2, admisión dinámica conservadora): este archivo NO
#   fija ningún máximo de previews; la antigua política «un único preview activo» queda obsoleta (workflows deshabilitados
#   hasta aprobación administrativa).
#
# Red: `preview_internal` (internal: true) para init y db; Coolify añade su red por preview y la red
# del proxy a los servicios con dominio. Si Coolify sobrescribe las redes definidas aquí (pendiente
# de verificar en el piloto, P-08), el aislamiento de red hacia producción se garantiza con la regla
# DOCKER-USER documentada en docs/previews-coolify.md (no aplicada todavía).

services:

  init:
    image: alpine:3.20
    # Genera, UNA sola vez por PR, los cuatro secretos del preview en el volumen `secrets` (exclusivo
    # del PR: Coolify lo sufija con -pr-<n>): contraseña de Postgres, secreto JWT, contraseña del
    # administrador de prueba y API key. gen <archivo> <longitud>: alfanumérico de /dev/urandom,
    # idempotente (no toca un archivo ya presente, así un redespliegue del mismo PR conserva los
    # valores) y atómico (archivo temporal + mv), con umask 077 y chmod 600. No imprime ningún valor.
    # Las variables del shell van como `$$` porque Docker Compose interpola `$var`/`${…}` en `command`
    # y `healthcheck` (`${#s}` lo rechaza y `$f` quedaría vacío en silencio).
    # Puerta de identidad (incidente del redespliegue del 2026-10-20): antes de generar nada, init exige que
    # la etiqueta con la que se eligieron las imágenes sea `sha-<40 hex>` y, si el entorno trae SOURCE_COMMIT
    # (Coolify lo inyecta por `env_file: .env`), que coincida con esa etiqueta. db depende de init y backend
    # de db; consola y clientes también dependen de init: con un SHA ausente, inválido o contradictorio no
    # arranca ningún servicio del preview.
    environment:
      # El valor NO empieza por `$` a propósito: el analizador de Coolify (parseDockerComposeFile) convierte en
      # variable de la aplicación cualquier entrada de `environment` cuyo valor empiece por `$`, tomando el
      # texto tras `:?`/`:-` como valor; `sha-${…}` queda fuera de esa regla y lo interpola docker compose.
      - PREVIEW_EXPECTED_IMAGE_TAG=sha-${SOURCE_COMMIT:?SOURCE_COMMIT requerido}
    command: >
      sh -c '
        set -eu
        umask 077
        tag="$${PREVIEW_EXPECTED_IMAGE_TAG:-}"
        printf "%s" "$$tag" | grep -Eq "^sha-[0-9a-f]{40}$$" || { echo "init: etiqueta de imagen invalida (se esperaba sha-<40 hex>); revisar SOURCE_COMMIT y que la aplicacion no tenga una variable SOURCE_COMMIT en Coolify" >&2; exit 1; }
        [ -z "$${SOURCE_COMMIT:-}" ] || [ "sha-$$SOURCE_COMMIT" = "$$tag" ] || { echo "init: SOURCE_COMMIT del entorno contradice la etiqueta de las imagenes; el preview no arranca" >&2; exit 1; }
        mkdir -p /secrets && chmod 700 /secrets
        gen() {
          [ -s "/secrets/$$1" ] && return 0
          s=""
          while [ "$${#s}" -lt "$$2" ]; do
            s="$$s$$(head -c 96 /dev/urandom | base64 | tr -dc "A-Za-z0-9")"
          done
          s=$$(printf "%s" "$$s" | cut -c1-"$$2")
          printf "%s" "$$s" > "/secrets/.$$1.tmp"
          [ "$$(wc -c < "/secrets/.$$1.tmp")" -eq "$$2" ] || { echo "init: $$1 con longitud incorrecta" >&2; exit 1; }
          chmod 600 "/secrets/.$$1.tmp" && mv "/secrets/.$$1.tmp" "/secrets/$$1"
        }
        gen pg_password 40
        gen jwt_secret 64
        gen admin_password 32
        gen api_key 48
        echo "secrets listos"
        exec sleep infinity'
    # Se queda vivo (sleep) en lugar de terminar: así el Compose es estándar (sin la clave propia
    # de Coolify `exclude_from_hc`, que `docker compose config` rechaza) y Coolify no ve un
    # contenedor "exited" en el preview. db espera a que este healthcheck confirme ambos secretos.
    healthcheck:
      test: ["CMD-SHELL", "for f in pg_password jwt_secret admin_password api_key; do test -s /secrets/$$f || exit 1; done"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - secrets:/secrets
    networks:
      - preview_internal
    mem_limit: 16m
    memswap_limit: 16m
    cpus: 0.1
    pids_limit: 32

  db:
    image: postgres:18-alpine
    # PostgreSQL 18: la imagen oficial monta el volumen en /var/lib/postgresql y coloca PGDATA en
    # /var/lib/postgresql/18/docker (verificar en el piloto con `SHOW data_directory`).
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    environment:
      POSTGRES_DB: auditbrain
      POSTGRES_USER: auditbrain
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - pgdata:/var/lib/postgresql
      - secrets:/run/secrets:ro
    networks:
      # Alias de red ESTABLE `db`: el backend arma DATABASE_URL=…@db:5432 (y preview_bootstrap EXIGE
      # que el host sea exactamente `db`). En los previews de Coolify el servicio/contenedor se publica
      # con sufijo de PR (p. ej. `db-pr-405`) y su alias DNS por defecto pasa a ser ese nombre sufijado,
      # así que `db` deja de resolver («could not translate host name "db"») y fallan login y el loop de
      # retención. Declarar el alias explícito lo mantiene resoluble como `db` en TODOS los PR, sin fijar
      # ningún número, y solo dentro de `preview_internal` (internal: true), nunca hacia producción.
      preview_internal:
        aliases:
          - db
    depends_on:
      init:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditbrain -d auditbrain"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.5
    cpu_shares: 256
    oom_score_adj: 700
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  backend:
    image: ghcr.io/jcalupinia/auditbrain-preview-backend:sha-${SOURCE_COMMIT:?SOURCE_COMMIT requerido}
    # Puerto interno declarado para que Coolify reconozca el puerto del dominio (no se publica en el host).
    expose:
      - "10000"
    # Arranque seguro (F1, hallazgo S-05): `export VAR="$(cat f)"` bajo `set -e` NO aborta si falla
    # `cat` (el estado es el de `export`), y con AUDITBRAIN_API_KEY vacía el backend desactivaría la
    # autenticación por API key. Por eso el guion: (1) rechaza credenciales heredadas del entorno de
    # Coolify (JWT, API key, contraseña de admin) ANTES de sobrescribirlas; (2) exige que los cuatro
    # archivos de /run/secrets existan y no estén vacíos; (3) lee cada valor con una asignación
    # independiente (`v=$(cat f) || exit 3`) y solo entonces exporta; (4) nunca imprime valores.
    # Identidad: si Coolify no rellena SERVICE_FQDN_BACKEND_10000 (PREVIEW_PUBLIC_HOST llega vacío, visto en
    # el primer preview de esta rama), se usa COOLIFY_FQDN, que Coolify sí entrega con el dominio del preview. No se
    # fija ningún número de PR: el validador fail-closed del backend (preview_bootstrap) sigue exigiendo que
    # el host cumpla el patrón <n>.api.preview.audit-ia.ec y coincida con COOLIFY_FQDN; vacío, productivo o
    # contradictorio => el proceso termina con código 3 igual que antes. Variables de shell escapadas con $$.
    command: >
      sh -c 'set -eu
             export SOURCE_COMMIT="$${PREVIEW_SOURCE_COMMIT:-}"
             export SOURCE_COMMIT="$${SOURCE_COMMIT#commit-}"
             export PREVIEW_PUBLIC_HOST="$${PREVIEW_PUBLIC_HOST:-$${COOLIFY_FQDN:-}}"
             if [ -n "$${AUDITBRAIN_JWT_SECRET:-}$${AUDITBRAIN_API_KEY:-}$${AUDITBRAIN_BOOTSTRAP_ADMIN_PASSWORD:-}" ]; then
               echo "preview: credencial heredada del entorno (JWT, API key o admin); el backend no arranca" >&2
               exit 3
             fi
             for f in pg_password admin_password api_key jwt_secret; do
               [ -s "/run/secrets/$$f" ] || { echo "preview: falta el secreto $$f; el backend no arranca" >&2; exit 3; }
             done
             pg=$$(cat /run/secrets/pg_password) || exit 3
             adm=$$(cat /run/secrets/admin_password) || exit 3
             key=$$(cat /run/secrets/api_key) || exit 3
             [ -n "$$pg" ] && [ -n "$$adm" ] && [ -n "$$key" ] || exit 3
             export DATABASE_URL="postgresql://auditbrain:$$pg@db:5432/auditbrain"
             export AUDITBRAIN_BOOTSTRAP_ADMIN_PASSWORD="$$adm"
             export AUDITBRAIN_API_KEY="$$key"
             unset pg adm key
             exec uvicorn app:app --host 0.0.0.0 --port 10000'
    environment:
      - SERVICE_FQDN_BACKEND_10000
      - APP_ENV=preview
      # Identidad del PR: única fuente primaria, rellenada por Coolify con el dominio del preview.
      - PREVIEW_PUBLIC_HOST=${SERVICE_FQDN_BACKEND_10000}
      # Identidad por commit (F1, hallazgo C-01): el backend exige que su BUILD_COMMIT coincida con
      # SOURCE_COMMIT (head del PR) y con la etiqueta esperada. SOURCE_COMMIT debe llegar al ENTORNO del
      # proceso. Coolify NO lo inyecta por `env_file: .env` (ese .env solo lo usa `docker compose` para
      # interpolar este archivo, no entra al runtime del contenedor): verificado en el preview #405, cuyo
      # backend quedó en bucle de reinicio con «SOURCE_COMMIT ausente o inválido». Por eso se transporta
      # explícitamente con un PREFIJO que NO empieza por `$` (igual que PREVIEW_EXPECTED_IMAGE_TAG) y el
      # `command` lo recupera (`$${PREVIEW_SOURCE_COMMIT#commit-}` → SOURCE_COMMIT). Cada PR trae el suyo,
      # interpolado por Coolify desde el mismo ${SOURCE_COMMIT}; no se fija ningún valor en el archivo.
      # PROHIBIDO escribir `- SOURCE_COMMIT=${SOURCE_COMMIT:?…}` (ni ninguna entrada cuyo valor empiece por
      # `$` salvo las mágicas SERVICE_*): el analizador de Coolify (parseDockerComposeFile) la convertiría
      # en una variable de la aplicación con el texto tras `:?` como valor («SOURCE_COMMIT requerido»),
      # volcada al final del .env del preview, y las imágenes se resolverían como `sha-SOURCE_COMMIT
      # requerido` (redespliegue fallido del 2026-10-20). Un valor que empieza por `commit-`/`sha-` no lo
      # es, así que el analizador lo deja pasar y lo interpola docker compose.
      - PREVIEW_EXPECTED_IMAGE_TAG=sha-${SOURCE_COMMIT:?SOURCE_COMMIT requerido}
      - PREVIEW_SOURCE_COMMIT=commit-${SOURCE_COMMIT:?SOURCE_COMMIT requerido}
      - PREVIEW_SECRETS_DIR=/run/secrets
      - CLIENT_PORTAL_SESSION_CHECK_ENABLED=false
      - CLIENT_PORTAL_DEVICE_CHECK_ENABLED=false
      # Administrador de prueba del preview: NO se hardcodea ningún correo aquí (el
      # repositorio es público). El correo del admin se configura en tiempo de
      # ejecución desde el archivo de identidades del volumen aislado del PR
      # (backend/app/core/preview_seed.py); si no hay configuración válida, el
      # código usa un fallback genérico NO-PII (`preview-admin@audit-ia.ec`). La
      # contraseña y la API key NO van por variables: las exporta el `command`
      # desde /run/secrets (exclusivas por PR).
      - AUD_CICLO_DIR=/var/data/aud_pruebas
      - AUD_OF_TMP_DIR=/var/data/of_tmp
      - AUD_PROCESO_PESADO_MAX=1
      - DOCUMENT_SERVICE=http://127.0.0.1:9
      - CORS_ALLOW_ORIGINS=
      - CLIENT_PORTAL_URL=https://preview-portal-no-resuelto.invalid
    volumes:
      - appdata:/var/data
      - secrets:/run/secrets:ro
    networks:
      - preview_internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:10000/healthz', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 1.5
    cpu_shares: 256
    oom_score_adj: 900
    pids_limit: 256
    ulimits:
      nofile: 4096
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  consola:
    image: ghcr.io/jcalupinia/auditbrain-preview-consola:sha-${SOURCE_COMMIT:?SOURCE_COMMIT requerido}
    # Puerto interno declarado para que Coolify reconozca el puerto del dominio (no se publica en el host).
    expose:
      - "80"
    environment:
      - SERVICE_FQDN_CONSOLA_80
    depends_on:
      init:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/build-info.json"]
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.2
    cpu_shares: 128
    oom_score_adj: 600
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  clientes:
    image: ghcr.io/jcalupinia/auditbrain-preview-clientes:sha-${SOURCE_COMMIT:?SOURCE_COMMIT requerido}
    # Puerto interno declarado para que Coolify reconozca el puerto del dominio (no se publica en el host).
    expose:
      - "80"
    environment:
      - SERVICE_FQDN_CLIENTES_80
    depends_on:
      init:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/build-info.json"]
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.2
    cpu_shares: 128
    oom_score_adj: 600
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

networks:
  preview_internal:
    internal: true

volumes:
  secrets:
  pgdata:
  appdata:
