us:9px;display:grid;place-items:center;background:#e5f4e9;color:#238452;font-weight:900}.step b{font-size:12px}.step small{font-size:11px;color:var(--mute);display:block}.step .go{margin-left:auto}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:14px}.tabs{display:flex;gap:5px;overflow:auto;padding:5px;border-radius:12px;background:#e3eee5;margin-bottom:17px}.tab{border:0;border-radius:9px;background:transparent;padding:10px 12px;white-space:nowrap;font-size:12px;font-weight:750;color:#65806e}.tab.active{color:#15593a;background:white;box-shadow:0 4px 13px #154b2920}.qa-question{padding:16px;border:1px solid #e4ebe5;border-radius:13px;margin:12px 0}.qa-question .opt{display:inline-flex;align-items:center;gap:5px;padding:7px 9px;margin:8px 7px 2px 0;background:#f3f8f4;border:1px solid #e0eae2;border-radius:8px;font-size:12px}.qa-question .opt:has(input:checked){background:#def4e4;border-color:#6ac08b}.checkline{display:flex;gap:9px;align-items:center;font-size:12px;margin:9px 0}.progress{height:8px;background:#e4eee7;border-radius:9px;overflow:hidden}.progress div{background:linear-gradient(90deg,#238f54,#8ddb88);height:100%;transition:width .2s}.ribbon{margin-bottom:16px;padding:12px 16px;background:#fff7e8;border:1px solid #f2e0bb;color:#826023;border-radius:12px;font-size:12px}.fileline{display:flex;gap:12px;align-items:center;border-bottom:1px solid #edf0ed;padding:11px 0}.fileline:last-child{border:0}.fileline .grow{flex:1}.fileline b{display:block;font-size:12px}.fileline small{font-size:11px;color:var(--mute)}.agent-button{position:fixed;right:26px;bottom:24px;z-index:10;border-radius:50px;background:#173b2d;color:white;box-shadow:0 10px 35px #0d312a58;border:1px solid #5eaf70;padding:13px 18px;font-weight:800}.agent-panel{position:fixed;z-index:11;right:24px;bottom:82px;width:min(425px,calc(100vw - 35px));height:min(630px,calc(100vh - 120px));background:white;box-shadow:0 20px 55px #0d2f2870;border:1px solid #c /* ===== Cuadra · NIIF 18 (dentro del paso 4 de la Etapa 1) ===== */
.cua-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:0 0 15px}
.cua-tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;font-weight:700;font-size:12px;color:var(--mute);cursor:pointer}
.cua-tab.on{color:var(--green);border-bottom-color:var(--green)}
table.cua{width:100%;border-collapse:collapse;font-size:12.5px}
table.cua th{text-align:left;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);padding:7px 8px;border-bottom:1px solid var(--line);font-weight:800}
table.cua td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.cua-num{text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
table.cua input,table.cua select,.cua-form input,.cua-form select{padding:6px 8px;border:1px solid #c6d6cd;border-radius:8px;background:#fff;color:var(--ink);max-width:100%}
table.cua input,table.cua select{width:100%}
table.cua input:focus,table.cua select:focus,.cua-form input:focus,.cua-form select:focus{outline:2px solid var(--green);outline-offset:-1px}
input.cua-amt{text-align:right;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.cua-stmt{width:100%;border-collapse:collapse;font-size:13px}
.cua-stmt td{padding:6px 8px;border-bottom:1px solid var(--line)}
.cua-stmt td:first-child{color:var(--mute)}
.cua-stmt tr.sub td{font-weight:800;color:var(--ink);border-top:1px solid var(--line)}
.cua-stmt tr.tot td{font-weight:800;border-top:2px solid var(--ink)}
.cua-banner{display:flex;align-items:center;gap:9px;border-radius:12px;padding:11px 15px;font-weight:700;margin:0 0 14px}
.cua-banner.ok{background:#e7f5ec;color:#136c44;border:1px solid #bfe0cc}
.cua-banner.bad{background:#fdecec;color:var(--error);border:1px solid #f3c7c4}
.cua-x{border:0;background:none;color:var(--error);font-weight:900;cursor:pointer;padding:3px 7px;border-radius:6px}
.cua-x:hover{background:#fdecec}
.cua-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.cua-bit{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.cua-hint{color:var(--mute);font-size:12px;margin:8px 0 0}
/* ===== Base normativa ===== */
.norma-buscar{width:100%;padding:11px 13px;border:1px solid #c6d6cd;border-radius:10px;background:#fff;font-size:14px;margin-bottom:12px}
.norma-buscar:focus{outline:2px solid var(--green);outline-offset:-1px}
.norma-item{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;margin-bottom:6px}
.norma-item b{min-width:76px;color:#0c5a3a}
.norma-item .nm{flex:1;min-width:180px}
.norma-ie{font-size:11px;font-weight:800;color:#8a6a12;white-space:nowrap}
.norma-sec{font-size:11px;letter-spacing:1.2px;font-weight:800;color:var(--mute);margin:18px 0 8px;text-transform:uppercase}
.cua-lock{background:var(--warn);border:1px solid #e9d9a8;border-radius:12px;padding:14px 16px;color:#5d4710}
.cua-lock b{display:block;margin-bottom:4px}
.sesion-chip{background:#13402f;color:#cfe9d7;border:1px solid #2f6b4c;border-radius:999px;padding:3px 11px;font-size:11px;font-weight:800}

</style></head><body><div id="app"></div><script>
window.NIIF18_KNOWLEDGE=[{"title": "Manual Auditconsulting V5.2 — página 111", "page": 111, "text": "Instrumentos de recepción y revisión. Banco de 139 preguntas originales, asociadas a PT-00 a PT-12. La respuesta de cada pregunta debe almacenarse con código, fecha, usuario, evidencia adjunta, resultado de prueba y decisión de aprobación. Las preguntas sectoriales del Anexo I se activan adicionalmente al perfil general."}, {"title": "Manual Auditconsulting V5.2 — página 111", "page": 111, "text": "Generar incidencia con responsable y fecha de resolución cuando falta evidencia o hay Excepción contradicción."}, {"title": "Manual Auditconsulting V5.2 — página 111", "page": 111, "text": "Aprobación de un profesional para actividades principales, MPM, derivados, excepción B68 y Juicio cambios de política."}, {"title": "Manual Auditconsulting V5.2 — página 112", "page": 112, "text": "PT-00-Q01 ¿La razón social y el RUC corresponden exactamente a la entidad legal que contrata la implementación?"}, {"title": "Manual Auditconsulting V5.2 — página 112", "page": 112, "text": "Evidencia de aceptación: Contrato, RUC y razón social verificados. Tratamiento de incumplimiento: No crear expediente si la identidad no es concluyente."}, {"title": "Manual Auditconsulting V5.2 — página 112", "page": 112, "text": "PT-00-Q02 ¿Se ha definido si el alcance es individual, consolidado, o incluye establecimientos de una misma sociedad?"}, {"title": "Manual Auditconsulting V5.2 — página 112", "page": 112, "text": "Evidencia de aceptación: Carta de contratación, estructura societaria y organigrama. Tratamiento de incumplimiento: Abrir incidencias cuando una cadena hotelera contenga sociedades independientes."}, {"title": "Manual Auditconsulting V5.2 — página 112", "page": 112, "text": "Evidencia de aceptación: Bitácora de alta, aprobador interno y perfiles. Tratamiento de incumplimiento: Rechazar alta de nuevas entidades solicitada por usuario cliente."}, {"title": "Manual Auditconsulting V5.2 — página 112", "page": 112, "text": "Evidencia de aceptación: Matriz de usuarios y permisos. Tratamiento de incumplimiento: RUC público no sustituye autenticación."}, {"title": "Manual Auditconsulting V5.2 — página 112", "page": 112, "text": "Evidencia de aceptación: Alcance aprobado y cronograma firmado. Tratamiento de incumplimiento: No iniciar transición sin período comparativo definido."}, {"title": "Manual Auditconsulting V5.2 — página 112", "page": 112, "text": "Evidencia de aceptación: RACI, perfiles de acceso, acta de designación. Tratamiento de incumplimiento: No permitir autoaprobación de juicios materiales."}, {"title": "Manual Auditconsulting V5.2 — página 112", "page": 112, "text": "Evidencia de aceptación: Contrato, acuerdo de confidencialidad y matriz de acceso. Tratamiento de incumplimiento: Suspender uso de archivos sin autorización legal."}, {"title": "Manual Auditconsulting V5.2 — página 112", "page": 112, "text": "Evidencia de aceptación: Alcance y entregables; responsables y salvaguardas. Tratamiento de incumplimiento: Evaluar independencia antes de firmar el trabajo."}, {"title": "Manual Auditconsulting V5.2 — página 112", "page": 112, "text": "PT-00-Q09 ¿Se documentaron los límites de alcance: bases de EEFF y soportes sin exigir mayores completos de forma general?"}, {"title": "Manual Auditconsulting V5.2 — página 112", "page": 112, "text": "Evidencia de aceptación: Solicitud IN-01 y alcance de evidencias. Tratamiento de incumplimiento: Pedir mayor sólo para partidas que no puedan resolverse con soporte disponible."}, {"title": "Manual Auditconsulting V5.2 — página 113", "page": 113, "text": "CONTROL: respuestas firmadas por preparador; casos materiales con evidencia de revisor. Se conserva historial de cambios y versiones."}, {"title": "Manual Auditconsulting V5.2 — página 114", "page": 114, "text": "Evidencia de aceptación: EEFF PDF, archivos estructurados y notas. Tratamiento de incumplimiento: Documentar faltantes y alternativa aprobada."}, {"title": "Manual Auditconsulting V5.2 — página 114", "page": 114, "text": "Evidencia de aceptación: Comparativo 2026 y estructura contable. Tratamiento de incumplimiento: Abrir GAP por línea no identificada."}, {"title": "Manual Auditconsulting V5.2 — página 114", "page": 114, "text": "Evidencia de aceptación: Estados, informes y política de presentación. Tratamiento de incumplimiento: GAP de presentación si falta el subtotal."}, {"title": "Manual Auditconsulting V5.2 — página 114", "page": 114, "text": "PT-01-Q04 ¿Existen rubros de intereses, dividendos, diferencias de cambio o derivados mezclados en otras partidas?"}, {"title": "Manual Auditconsulting V5.2 — página 114", "page": 114, "text": "Evidencia de aceptación: Notas, deuda, inversiones, relaciones de origen. Tratamiento de incumplimiento: Solicitar apertura IN-04/05 o detalle condicionado."}, {"title": "Manual Auditconsulting V5.2 — página 114", "page": 114, "text": "Evidencia de aceptación: Centros de costo, cédulas y política. Tratamiento de incumplimiento: GAP de datos PT-06 si no hay desglose."}, {"title": "Manual Auditconsulting V5.2 — página 114", "page": 114, "text": "Evidencia de aceptación: Detalle por naturaleza y justificación de materialidad. Tratamiento de incumplimiento: Proponer desagregación o nota."}, {"title": "Manual Auditconsulting V5.2 — página 114", "page": 114, "text": "Evidencia de aceptación: Presentaciones, prensa, informes públicos. Tratamiento de incumplimiento: No concluir ausencia de MPM sin búsqueda documentada."}, {"title": "Manual Auditconsulting V5.2 — página 114", "page": 114, "text": "Evidencia de aceptación: Plan de 2026 e insumos de adopción. Tratamiento de incumplimiento: Priorizar brecha crítica de transición."}, {"title": "Manual Auditconsulting V5.2 — página 114", "page": 114, "text": "Evidencia de aceptación: Estado de flujos, metodología de método indirecto. Tratamiento de incumplimiento: Abrir GAP PT-09 en caso de diferencia."}, {"title": "Manual Auditconsulting V5.2 — página 114", "page": 114, "text": "Evidencia de aceptación: Matriz GAP firmada. Tratamiento de incumplimiento: No marcar cierre sin evidencia de remediación."}, {"title": "Manual Auditconsulting V5.2 — página 114", "page": 114, "text": "CONTROL: respuestas firmadas por preparador; casos materiales con evidencia de revisor. Se conserva historial de cambios y versiones. Auditconsulting | Manual NIIF 18 v5.2 • 114"}, {"title": "Manual Auditconsulting V5.2 — página 115", "page": 115, "text": "Evidencia de aceptación: Contratos, estatuto, segmentos y fuente de ingresos. Tratamiento de incumplimiento: Evaluar cada RUC de manera autónoma."}, {"title": "Manual Auditconsulting V5.2 — página 115", "page": 115, "text": "Evidencia de aceptación: KPIs, asignación de recursos, informes de gestión. Tratamiento de incumplimiento: Aplicar los criterios de B30-B41; no inferir de balances elevados."}, {"title": "Manual Auditconsulting V5.2 — página 115", "page": 115, "text": "Evidencia de aceptación: Productos financieros, reportes a gerencia, ingresos por interés. Tratamiento de incumplimiento: Activar análisis condicionado de párrafos 65-66."}, {"title": "Manual Auditconsulting V5.2 — página 115", "page": 115, "text": "Evidencia de aceptación: Presentaciones, presupuestos, actas y reportes. Tratamiento de incumplimiento: Comparar con indicadores públicos y segmentos."}, {"title": "Manual Auditconsulting V5.2 — página 115", "page": 115, "text": "PT-02-Q05 ¿Existen actividades separadas por establecimiento que no representan negocios principales de la entidad legal?"}, {"title": "Manual Auditconsulting V5.2 — página 115", "page": 115, "text": "Evidencia de aceptación: Organigrama, centros de beneficios y estados individuales. Tratamiento de incumplimiento: Evitar inferir excepciones desde un hotel aislado."}, {"title": "Manual Auditconsulting V5.2 — página 115", "page": 115, "text": "PT-02-Q06 ¿Las inversiones generan rendimientos individualmente y mayormente independientes de otros recursos?"}, {"title": "Manual Auditconsulting V5.2 — página 115", "page": 115, "text": "Evidencia de aceptación: Contratos, origen del retorno, utilización del activo. Tratamiento de incumplimiento: No equiparar alquiler accesorio con actividad inversora principal."}, {"title": "Manual Auditconsulting V5.2 — página 115", "page": 115, "text": "PT-02-Q07 ¿Los préstamos concedidos se originan en una prestación comercial incidental o una oferta de financiación a clientes?"}, {"title": "Manual Auditconsulting V5.2 — página 115", "page": 115, "text": "Evidencia de aceptación: Contratos, política comercial y materialidad. Tratamiento de incumplimiento: Requerir juicio; no decidir por rubro “interés”."}, {"title": "Manual Auditconsulting V5.2 — página 115", "page": 115, "text": "Evidencia de aceptación: Segmentos, estructura comercial y comunicaciones. Tratamiento de incumplimiento: Registrar evidencia contradictoria, no sólo confirmatoria."}, {"title": "Manual Auditconsulting V5.2 — página 115", "page": 115, "text": "Evidencia de aceptación: Matriz de afectación por partida. Tratamiento de incumplimiento: Propagar cambio sólo mediante regla aprobada al PT-03."}, {"title": "Manual Auditconsulting V5.2 — página 115", "page": 115, "text": "Evidencia de aceptación: Memo PT-02 firmado y versión. Tratamiento de incumplimiento: Bloquear PT-03 si el juicio relevante está pendiente."}, {"title": "Manual Auditconsulting V5.2 — página 116", "page": 116, "text": "CONTROL: respuestas firmadas por preparador; casos materiales con evidencia de revisor. Se conserva historial de cambios y versiones."}, {"title": "Manual Auditconsulting V5.2 — página 117", "page": 117, "text": "Evidencia de aceptación: Balance y suma firmada, período y moneda. Tratamiento de incumplimiento: Bloqueo por diferencias de cobertura."}, {"title": "Manual Auditconsulting V5.2 — página 117", "page": 117, "text": "Evidencia de aceptación: Rule_ID, cuenta, soporte y referencia normativa. Tratamiento de incumplimiento: No aceptar “sin clasificar”."}, {"title": "Manual Auditconsulting V5.2 — página 117", "page": 117, "text": "Evidencia de aceptación: Apertura, contrato y atributos de transacción. Tratamiento de incumplimiento: Proponer split y excepción de datos."}, {"title": "Manual Auditconsulting V5.2 — página 117", "page": 117, "text": "Evidencia de aceptación: Memo de actividad principal y flag autorizado. Tratamiento de incumplimiento: Evitar aplicación automática de excepción sectorial."}, {"title": "Manual Auditconsulting V5.2 — página 117", "page": 117, "text": "Evidencia de aceptación: Detalle de bancos, depósitos e interés. Tratamiento de incumplimiento: No enviar todo interés a operación."}, {"title": "Manual Auditconsulting V5.2 — página 117", "page": 117, "text": "PT-03-Q06 ¿Los ingresos/gastos de préstamos bancarios y otros pasivos se distinguieron por tipo de financiación?"}, {"title": "Manual Auditconsulting V5.2 — página 117", "page": 117, "text": "Evidencia de aceptación: Contratos y componentes de interés. Tratamiento de incumplimiento: Aplicar 59-66 y B50-B59 con evidencia."}, {"title": "Manual Auditconsulting V5.2 — página 117", "page": 117, "text": "Evidencia de aceptación: Fuente monetaria NIC 21 y vínculo de partida. Tratamiento de incumplimiento: Clasificar según B65-B67; evaluar B68 por transacción."}, {"title": "Manual Auditconsulting V5.2 — página 117", "page": 117, "text": "Evidencia de aceptación: Estimación documentada y aprobación. Tratamiento de incumplimiento: Operación sólo para diferencias elegibles."}, {"title": "Manual Auditconsulting V5.2 — página 117", "page": 117, "text": "Evidencia de aceptación: Contratos, designación, riesgo gestionado. Tratamiento de incumplimiento: Aplicar árbol B70-B76 y bloquear extrapolación improcedente."}, {"title": "Manual Auditconsulting V5.2 — página 117", "page": 117, "text": "Evidencia de aceptación: Notas NIC 12, NIIF 5 y conciliación. Tratamiento de incumplimiento: Prohibir asignación a operación por defecto."}, {"title": "Manual Auditconsulting V5.2 — página 117", "page": 117, "text": "Evidencia de aceptación: Jerarquía, Rule_ID, cobertura de reglas. Tratamiento de incumplimiento: Si hay empate al mismo nivel, generar excepción."}, {"title": "Manual Auditconsulting V5.2 — página 118", "page": 118, "text": "Evidencia de aceptación: Log de cambios, decisión profesional. Tratamiento de incumplimiento: Sin aprobación no se publica versión definitiva."}, {"title": "Manual Auditconsulting V5.2 — página 118", "page": 118, "text": "CONTROL: respuestas firmadas por preparador; casos materiales con evidencia de revisor. Se conserva historial de cambios y versiones."}, {"title": "Manual Auditconsulting V5.2 — página 119", "page": 119, "text": "Evidencia de aceptación: Modelo de estado y cuentas clasificadas. Tratamiento de incumplimiento: No forzar categorías sin partidas ni omitir las aplicables."}, {"title": "Manual Auditconsulting V5.2 — página 119", "page": 119, "text": "Evidencia de aceptación: Reporte de duplicados y sumas. Tratamiento de incumplimiento: Bloqueo por duplicación."}, {"title": "Manual Auditconsulting V5.2 — página 119", "page": 119, "text": "Evidencia de aceptación: Puente anterior/nuevo. Tratamiento de incumplimiento: Investigar cualquier variación del resultado."}, {"title": "Manual Auditconsulting V5.2 — página 119", "page": 119, "text": "Evidencia de aceptación: Nota fiscal, plan de cuentas y detalle. Tratamiento de incumplimiento: Separar otros tributos conforme a hechos."}, {"title": "Manual Auditconsulting V5.2 — página 119", "page": 119, "text": "Evidencia de aceptación: Memo y estados NIIF 5. Tratamiento de incumplimiento: No etiquetar operación vendida sin base."}, {"title": "Manual Auditconsulting V5.2 — página 119", "page": 119, "text": "Evidencia de aceptación: Mapa de reglas y memo. Tratamiento de incumplimiento: Rechazar inconsistencias de excepción."}, {"title": "Manual Auditconsulting V5.2 — página 119", "page": 119, "text": "Evidencia de aceptación: Tabla por signo, revisión de saldos y notas. Tratamiento de incumplimiento: Corregir o explicar antes de salida."}, {"title": "Manual Auditconsulting V5.2 — página 119", "page": 119, "text": "Evidencia de aceptación: Trazabilidad de conversión. Tratamiento de incumplimiento: Enviar diferencias a PT-11."}, {"title": "Manual Auditconsulting V5.2 — página 119", "page": 119, "text": "Evidencia de aceptación: Aprobación y versión del reporte. Tratamiento de incumplimiento: No emitir OUT-05 como definitivo sin sign-off."}, {"title": "Manual Auditconsulting V5.2 — página 119", "page": 119, "text": "CONTROL: respuestas firmadas por preparador; casos materiales con evidencia de revisor. Se conserva historial de cambios y versiones."}, {"title": "Manual Auditconsulting V5.2 — página 120", "page": 120, "text": "Evidencia de aceptación: Sumatoria de partidas operativas. Tratamiento de incumplimiento: Bloqueo por omisión, salvo régimen aplicable que lo modifique."}, {"title": "Manual Auditconsulting V5.2 — página 120", "page": 120, "text": "Evidencia de aceptación: Perfil PT-02, párrafos 69-74. Tratamiento de incumplimiento: Registrar excepciones, particularmente perfil financiero."}, {"title": "Manual Auditconsulting V5.2 — página 120", "page": 120, "text": "Evidencia de aceptación: Ledger de cálculo Python y configuración. Tratamiento de incumplimiento: Mantener cálculo determinístico interno."}, {"title": "Manual Auditconsulting V5.2 — página 120", "page": 120, "text": "Evidencia de aceptación: Memo con justificación y ejemplos. Tratamiento de incumplimiento: Eliminar o reubicar subtotal engañoso."}, {"title": "Manual Auditconsulting V5.2 — página 120", "page": 120, "text": "Evidencia de aceptación: Glosario de líneas y política de denominaciones. Tratamiento de incumplimiento: Modificar etiquetas ambiguas."}, {"title": "Manual Auditconsulting V5.2 — página 120", "page": 120, "text": "Evidencia de aceptación: Inventario de medidas y comunicaciones. Tratamiento de incumplimiento: Derivar candidatas a PT-08."}, {"title": "Manual Auditconsulting V5.2 — página 120", "page": 120, "text": "Evidencia de aceptación: Comparativo y parámetros aprobados. Tratamiento de incumplimiento: No emitir comparativo con mezcla de criterios."}, {"title": "Manual Auditconsulting V5.2 — página 120", "page": 120, "text": "Evidencia de aceptación: Reporte de aritmética y revisión. Tratamiento de incumplimiento: Bloquear emisión por descuadre."}, {"title": "Manual Auditconsulting V5.2 — página 120", "page": 120, "text": "CONTROL: respuestas firmadas por preparador; casos materiales con evidencia de revisor. Se conserva historial de cambios y versiones."}, {"title": "Manual Auditconsulting V5.2 — página 121", "page": 121, "text": "Evidencia de aceptación: Matriz de simulación y criterio de utilidad. Tratamiento de incumplimiento: No repetir opción histórica sin análisis."}, {"title": "Manual Auditconsulting V5.2 — página 121", "page": 121, "text": "Evidencia de aceptación: Memo y estructura de gastos. Tratamiento de incumplimiento: Requerir justificación cualitativa."}, {"title": "Manual Auditconsulting V5.2 — página 121", "page": 121, "text": "Evidencia de aceptación: Manual de costos y política. Tratamiento de incumplimiento: Evitar asignaciones basadas sólo en nombre de cuenta."}, {"title": "Manual Auditconsulting V5.2 — página 121", "page": 121, "text": "Evidencia de aceptación: Consolidado personal/centros. Tratamiento de incumplimiento: Habilitar nota por naturaleza sin doble cómputo."}, {"title": "Manual Auditconsulting V5.2 — página 121", "page": 121, "text": "Evidencia de aceptación: Detalle de activos y cédulas. Tratamiento de incumplimiento: Aclarar distribución entre costo/administración."}, {"title": "Manual Auditconsulting V5.2 — página 121", "page": 121, "text": "Evidencia de aceptación: Detalle NIC 36. Tratamiento de incumplimiento: Distinguir del deterioro de instrumentos financieros."}, {"title": "Manual Auditconsulting V5.2 — página 121", "page": 121, "text": "Evidencia de aceptación: Detalle NIC 2. Tratamiento de incumplimiento: Verificar acumulación y presentación consistente."}, {"title": "Manual Auditconsulting V5.2 — página 121", "page": 121, "text": "Evidencia de aceptación: Cuadro de conciliación con total de gastos. Tratamiento de incumplimiento: Bloquear por cifras duplicadas."}, {"title": "Manual Auditconsulting V5.2 — página 121", "page": 121, "text": "Evidencia de aceptación: Cuadro histórico y reclasificación. Tratamiento de incumplimiento: Añadir ajuste de transición cuando aplique."}, {"title": "Manual Auditconsulting V5.2 — página 121", "page": 121, "text": "Evidencia de aceptación: Memo con referencia exacta y fact pattern. Tratamiento de incumplimiento: Rechazar una exención global no sustentada."}, {"title": "Manual Auditconsulting V5.2 — página 121", "page": 121, "text": "CONTROL: respuestas firmadas por preparador; casos materiales con evidencia de revisor. Se conserva historial de cambios y versiones."}, {"title": "Manual Auditconsulting V5.2 — página 122", "page": 122, "text": "Evidencia de aceptación: Análisis de componentes y función de línea. Tratamiento de incumplimiento: Separar partidas disímiles materiales."}, {"title": "Manual Auditconsulting V5.2 — página 122", "page": 122, "text": "Evidencia de aceptación: Glosario y componentes del rubro. Tratamiento de incumplimiento: Desagregar si etiqueta oculta información."}, {"title": "Manual Auditconsulting V5.2 — página 122", "page": 122, "text": "Evidencia de aceptación: Criterios documentados y juicio. Tratamiento de incumplimiento: No usar umbral rígido como único filtro."}, {"title": "Manual Auditconsulting V5.2 — página 122", "page": 122, "text": "Evidencia de aceptación: Matriz de ubicación y justificación. Tratamiento de incumplimiento: Probar resumen estructurado útil."}, {"title": "Manual Auditconsulting V5.2 — página 122", "page": 122, "text": "Evidencia de aceptación: Matriz de compensación y norma aplicable. Tratamiento de incumplimiento: Separar saldos sin base normativa de neteo."}, {"title": "Manual Auditconsulting V5.2 — página 122", "page": 122, "text": "Evidencia de aceptación: Referencias cruzadas y control de integridad. Tratamiento de incumplimiento: La nota desagrega, no agrega importe al total."}, {"title": "Manual Auditconsulting V5.2 — página 122", "page": 122, "text": "Evidencia de aceptación: Memo 77+B78-B79 y materialidad. Tratamiento de incumplimiento: No convertir preferencia de diseño en obligación."}, {"title": "Manual Auditconsulting V5.2 — página 122", "page": 122, "text": "Evidencia de aceptación: Comparativo y catálogo de etiquetas. Tratamiento de incumplimiento: Documentar cambios significativos."}, {"title": "Manual Auditconsulting V5.2 — página 122", "page": 122, "text": "Evidencia de aceptación: Control documental y registro de diferencias. Tratamiento de incumplimiento: Registrar diferencias explicables, no copiar modelos."}, {"title": "Manual Auditconsulting V5.2 — página 122", "page": 122, "text": "CONTROL: respuestas firmadas por preparador; casos materiales con evidencia de revisor. Se conserva historial de cambios y versiones."}, {"title": "Manual Auditconsulting V5.2 — página 123", "page": 123, "text": "Evidencia de aceptación: Informes de gestión, resultados y presentaciones públicas. Tratamiento de incumplimiento: No concluir que no hay MPM sin evidencias de búsqueda."}, {"title": "Manual Auditconsulting V5.2 — página 123", "page": 123, "text": "Evidencia de aceptación: Fórmula y naturaleza de sus componentes. Tratamiento de incumplimiento: RevPAR, ADR y ocupación no califican por ser métricas operativas."}, {"title": "Manual Auditconsulting V5.2 — página 123", "page": 123, "text": "Evidencia de aceptación: Definición oficial y tabla de términos. Tratamiento de incumplimiento: Excluir medidas definidas en NIIF."}, {"title": "Manual Auditconsulting V5.2 — página 123", "page": 123, "text": "Evidencia de aceptación: Declaraciones de gerencia y usos públicos. Tratamiento de incumplimiento: Métricas de un hotel o segmento aislado requieren análisis específico."}, {"title": "Manual Auditconsulting V5.2 — página 123", "page": 123, "text": "Evidencia de aceptación: Tipo de comunicación, soporte y fecha. Tratamiento de incumplimiento: Distinguir de publicaciones orales, transcripciones o redes sociales."}, {"title": "Manual Auditconsulting V5.2 — página 123", "page": 123, "text": "Evidencia de aceptación: Memo de evaluación y contraindicadores. Tratamiento de incumplimiento: No aceptar exclusión informal de una medida publicada."}, {"title": "Manual Auditconsulting V5.2 — página 123", "page": 123, "text": "Evidencia de aceptación: Base de subtotales y explicación. Tratamiento de incumplimiento: Rechazar conciliaciones a importes arbitrarios."}, {"title": "Manual Auditconsulting V5.2 — página 123", "page": 123, "text": "Evidencia de aceptación: Cédula de ajustes, documentos y política. Tratamiento de incumplimiento: No admitir montos agregados sin sustento."}, {"title": "Manual Auditconsulting V5.2 — página 123", "page": 123, "text": "Evidencia de aceptación: Cálculo fiscal y tasa aplicable. Tratamiento de incumplimiento: No aplicar automáticamente tarifa única a ajustes heterogéneos."}, {"title": "Manual Auditconsulting V5.2 — página 123", "page": 123, "text": "Evidencia de aceptación: Estructura de consolidación y cálculo. Tratamiento de incumplimiento: Registrar NCI cero sólo con soporte."}, {"title": "Manual Auditconsulting V5.2 — página 123", "page": 123, "text": "Evidencia de aceptación: Texto revisado y evidencia. Tratamiento de incumplimiento: Completar narrativa además de cifras."}, {"title": "Manual Auditconsulting V5.2 — página 124", "page": 124, "text": "Evidencia de aceptación: Borrador de nota y comparativo. Tratamiento de incumplimiento: Bloquear nota fragmentada e incompleta."}, {"title": "Manual Auditconsulting V5.2 — página 124", "page": 124, "text": "Evidencia de aceptación: Política versionada y conciliaciones anteriores. Tratamiento de incumplimiento: Añadir explicación de cambios y efecto comparativo."}, {"title": "Manual Auditconsulting V5.2 — página 124", "page": 124, "text": "Evidencia de aceptación: Acta de aprobación y firmas. Tratamiento de incumplimiento: No publicar sin dualidad gerencia/técnico."}, {"title": "Manual Auditconsulting V5.2 — página 124", "page": 124, "text": "CONTROL: respuestas firmadas por preparador; casos materiales con evidencia de revisor. Se conserva historial de cambios y versiones."}, {"title": "Manual Auditconsulting V5.2 — página 125", "page": 125, "text": "Base normativa: NIC 7 modificada por NIIF 18 | Entradas: IN-07; EEFF y flujo histórico | Salida / control: OUT-05 / OUT-08"}, {"title": "Manual Auditconsulting V5.2 — página 125", "page": 125, "text": "Evidencia de aceptación: Estado de flujos y política aprobada. Tratamiento de incumplimiento: Ruta de actualización según método."}, {"title": "Manual Auditconsulting V5.2 — página 125", "page": 125, "text": "Evidencia de aceptación: Flujo reconfigurado y conciliación. Tratamiento de incumplimiento: Actualizar arranque sin perder ajustes no monetarios."}, {"title": "Manual Auditconsulting V5.2 — página 125", "page": 125, "text": "Evidencia de aceptación: Política, recibos y perfil PT-02. Tratamiento de incumplimiento: No equiparar mecánicamente con categorías de estado de resultados."}, {"title": "Manual Auditconsulting V5.2 — página 125", "page": 125, "text": "Evidencia de aceptación: Extractos y detalle de efectivo. Tratamiento de incumplimiento: Seleccionar tratamiento bajo NIC 7 modificada."}, {"title": "Manual Auditconsulting V5.2 — página 125", "page": 125, "text": "Evidencia de aceptación: Movimientos y comprobantes. Tratamiento de incumplimiento: Evitar traslados indiscriminados."}, {"title": "Manual Auditconsulting V5.2 — página 125", "page": 125, "text": "Evidencia de aceptación: Impuestos y estado de flujos. Tratamiento de incumplimiento /* ==================== SESIÓN DEL PORTAL AUDIT-IA ====================
   Sin login propio. El token lo emite el portal (HS256) y viaja en
   `Authorization: Bearer`. Se lee del almacenamiento del portal
   (`ab_client_token`, mismo origen). La base de la API llega por `?api=`
   (una URL, no un secreto); si no viene, se usa el mismo origen.
   El rol solo decide QUÉ SE MUESTRA: el bloqueo real es del backend. */
let SESION=null, MANIFIESTO=null, NORMATIVA_ERROR=null;
const API_BASE=(()=>{
  try{
    const p=new URLSearchParams(location.search).get('api');
    if(p)return p.replace(/\/+$/,'');
  }catch(e){}
  return '';
})();
const esOperador=()=>!!(SESION&&(SESION.rol==='admin'||SESION.rol==='user'));
function portalToken(){
  try{return localStorage.getItem('ab_client_token')||''}catch(e){return ''}
}
async function apiNiif(ruta){
  const t=portalToken();
  const r=await fetch(`${API_BASE}/api/v1/client/niif18${ruta}`,{
    credentials:'include',
    headers:Object.assign({'Accept':'application/json'},t?{'Authorization':'Bearer '+t}:{})
  });
  if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}
  return r.json();
}
async function cargarSesion(){
  try{const d=await apiNiif('/me');SESION=d.usuario||null}
  catch(e){SESION=null}
}
async function cargarManifiesto(){
  try{MANIFIESTO=await apiNiif('/normas');NORMATIVA_ERROR=null;return}
  catch(e){NORMATIVA_ERROR=e.status===401?'sesion':'red'}
  try{ // respaldo local (uso fuera del portal, p. ej. revisión técnica)
    const r=await fetch('base-normativa/manifiesto.json');
    if(r.ok){MANIFIESTO=await r.json();NORMATIVA_ERROR=null}
  }catch(e){}
}
/* URL de una norma: la sirve el backend del portal, con sesión. */
const urlNorma=h=>`${API_BASE}/api/v1/client/niif18/biblioteca/${String(h).replace(/^libro\//,'')}`;

/* ==================== CUADRA · NIIF 18 ====================
   Las partidas vienen de la homologación (state.accounts). OJO con el signo:
   en el Studio `amount` YA ES el efecto en resultado (ingreso positivo, gasto
   negativo), al revés que el Cuadra autónomo. Por eso aquí NO se niega. */
const CUA_CAT_STUDIO={'Operación':'operating','Inversión':'investing','Financiación':'financing','Impuesto':'income_tax','Discontinuadas':'discontinued','Pendiente':''};
const CUA_CATS=[['operating','Operación'],['investing','Inversión'],['financing','Financiación'],['income_tax','Impuesto a la renta'],['discontinued','Discontinuadas'],['','— sin clasificar —']];
const cuaSemilla=()=>({extras:[],mpms:[],notas:[],notasStale:true,bitacora:[],tab:'estados',ent:0});
const cuaMoney=n=>Number(n||0).toLocaleString('es-EC',{minimumFractionDigits:2,maximumFractionDigits:2});
const cuaSubNombre={op:'Resultado de operación',pbft:'Antes de financ. e imp.',pbt:'Antes de impuestos',profit:'Resultado del periodo'};
function cuaEstado(){if(!state.cuadra)state.cuadra=cuaSemilla();return state.cuadra}

function cuaFilasPrincipal(){
  return (state.accounts||[]).map(r=>({code:r.code,name:r.name,amt:Number(r.amount)||0,cat:CUA_CAT_STUDIO[r.category]??''}));
}
function cuaEntidades(){
  const c=cuaEstado();
  return [{id:'principal',name:(state.company&&state.company.name)||'Entidad principal',principal:true,rows:cuaFilasPrincipal()}].concat(c.extras||[]);
}
function cuaEntActual(){const c=cuaEstado(),e=cuaEntidades();return e[Math.min(c.ent||0,e.length-1)]||e[0]}
function cuaFilas(){return cuaEntActual().rows||[]}
function cuaCalc(rs){
  const by={operating:0,investing:0,financing:0,income_tax:0,discontinued:0};
  let unclass=0,inc=0,exp=0,tax=0;
  for(const r of (rs||[])){const e=Number(r.amt)||0;
    if(!r.cat){unclass++;continue}
    by[r.cat]=(by[r.cat]||0)+e;
    if(r.cat==='income_tax')tax+=e;else{if(e>=0)inc+=e;else exp+=e}}
  const op=by.operating,pbft=op+by.investing,pbt2=pbft+by.financing,profit2=pbt2+by.income_tax+by.discontinued;
  const pbt1=inc+exp,profit1=pbt1+tax;
  return{by,unclass,inc,exp,tax,pbt1,profit1,op,pbft,pbt2,profit2,diff:profit1-profit2};
}
const cuaSubVal=(c,k)=>k==='op'?c.op:k==='pbft'?c.pbft:k==='pbt'?c.pbt2:c.profit2;
const cuaTrr=(l,v,cls='')=>`<tr class="${cls}"><td>${l}</td><td class="cua-num">${cuaMoney(v)}</td></tr>`;
function cuaLog(accion){const c=cuaEstado();c.bitacora.unshift({ts:new Date().toISOString(),actor:state.localUser||'preparador',accion});c.bitacora=c.bitacora.slice(0,300);save()}
function cuaFecha(iso){try{return new Date(iso).toLocaleString('es-EC',{hour12:false})}catch(e){return iso}}

function cuaIas1HTML(c){return cuaTrr('Ingresos',c.inc)+cuaTrr('Gastos',c.exp)+cuaTrr('Resultado antes de impuestos',c.pbt1,'sub')+cuaTrr('Impuesto a la renta',c.tax)+cuaTrr('Resultado del periodo',c.profit1,'tot')}
function cuaIfrs18HTML(c){return cuaTrr('Resultado de operación',c.op,'sub')+cuaTrr('Inversión',c.by.investing)+cuaTrr('Resultado antes de financiación e impuestos',c.pbft,'sub')+cuaTrr('Financiación',c.by.financing)+cuaTrr('Resultado antes de impuestos',c.pbt2,'sub')+cuaTrr('Impuesto a la renta',c.by.income_tax)+cuaTrr('Resultado del periodo',c.profit2,'tot')}
function cuaRecon(c){
  return c.diff===0
    ?{cls:'cua-banner ok',html:`✓ Concilia · mismo resultado del periodo en ambas presentaciones: <strong style="margin-left:4px">${cuaMoney(c.profit1)}</strong>`}
    :{cls:'cua-banner bad',html:`✕ No concilia · diferencia de ${cuaMoney(c.diff)}`};
}
function cuaUnclass(c){return c.unclass>0?{cls:'tag pending',txt:`${c.unclass} sin clasificar`}:{cls:'tag',txt:'todo clasificado'}}
function cuaNotasPill(){
  const cc=cuaEstado();
  if(!cc.notas.length)return{cls:'tag pending',txt:'sin generar'};
  return cc.notasStale?{cls:'tag pending',txt:'desfasadas — volver a poblar'}:{cls:'tag',txt:'consistentes'};
}
function cuaMpmHTML(c){
  const m=cuaEstado().mpms;
  if(!m.length)return `<tr><td colspan="7" class="muted">Sin MPM definidos.</td></tr>`;
  return m.map((x,i)=>{
    const s=cuaSubVal(c,x.sub),dif=Number(x.val)-s;
    const et=x.status==='approved'?`<span class="tag">aprobado</span>`:`<span class="tag pending">borrador</span>`;
    const puede=(state.localUser==='revisor')&&x.status!=='approved';
    return `<tr><td>${esc(x.name)}</td><td class="muted">${cuaSubNombre[x.sub]}</td><td class="cua-num">${cuaMoney(x.val)}</td><td class="cua-num">${cuaMoney(s)}</td><td class="cua-num">${cuaMoney(dif)}</td><td>${et}</td><td style="white-space:nowrap"><button class="btn" data-action="cua:approveMpm" data-i="${i}" ${puede?'':'disabled'}>Aprobar</button> <button class="cua-x" data-action="cua:delMpm" data-i="${i}" title="Eliminar">✕</button></td></tr>`;
  }).join('');
}
function cuaRecalcular(){
  const c=cuaCalc(cuaFilas());
  const i1=$('#cuaIas1');if(i1)i1.innerHTML=cuaIas1HTML(c);
  const i2=$('#cuaIfrs18');if(i2)i2.innerHTML=cuaIfrs18HTML(c);
  const b=$('#cuaRecon'),r=cuaRecon(c);if(b){b.className=r.cls;b.innerHTML=r.html}
  const u=$('#cuaUnclass'),uu=cuaUnclass(c);if(u){u.className=uu.cls;u.textContent=uu.txt}
  const mp=$('#cuaMpmRows');if(mp)mp.innerHTML=cuaMpmHTML(c);
  const ns=$('#cuaNotasEstado'),np=cuaNotasPill();if(ns){ns.className=np.cls;ns.textContent=np.txt}
}

  const filas=ent.principal

        <td><input class="cua-amt" type="number" step="0.01" value="${esc(r.amt)}" data-cua-cell="${i}:amt" aria-label="Efecto en resultado"></td>
        <td><select data-cua="cat" data-i="${i}" aria-label="Categoría">${CUA_CATS.map(k=>`<option value="${k[0]}" ${k[0]===r.cat?'selected':''}>${k[1]}</option>`).join('')}</select></td>
        <td><button class="cua-x" data-action="cua:delRow" data-i="${i}">✕</button></td></tr>`).join('');
  const cab=ent.principal

function cuaVistaConsol(){

    <section class="panel"><h2>Grupo · NIIF 18</h2><table class="cua-stmt"><tbody>${cuaTrr('Resultado de operación',op,'sub')+cuaTrr('Inversión',agg.investing)+cuaTrr('Antes de financiación e impuestos',pbft,'sub')+cuaTrr('Financiación',agg.financing)+cuaTrr('Antes de impuestos',pbt2,'sub')+cuaTrr('Impuesto',agg.income_tax)+cuaTrr('Resultado del periodo',profit2,'tot')}</tbody></table></section>

function cuaAccion(a,b){
  const c=cuaEstado(),i=b&&b.dataset.i!==undefined?Number(b.dataset.i):-1;
  if(a==='tab'){c.tab=b.dataset.t;save();render();return}
  if(a==='addEnt'){const n=(c.extras||[]).length+1;c.extras.push({id:'e'+Date.now(),name:'Subsidiaria '+n,rows:[]});c.ent=cuaEntidades().length-1;cuaLog(`creó ${c.extras[c.extras.length-1].name}`);save();render();return}
  if(a==='addRow'){const e=cuaEntActual();if(e.principal){flash('Las partidas de la entidad principal se editan en homologación');return}e.rows.push({code:'',name:'',amt:0,cat:''});cuaLog(`[${e.name}] agregó partida`);save();render();return}
  if(a==='delRow'){const e=cuaEntActual();if(e.principal)return;const cod=e.rows[i]?.code||'(s/código)';e.rows.splice(i,1);cuaLog(`[${e.name}] eliminó partida ${cod}`);save();render();return}
  if(a==='exportCSV'){
    const e=cuaEntActual();
    const texto='code,name,effect,category\n'+e.rows.map(r=>`${r.code},"${String(r.name).replace(/"/g,'""')}",${r.amt},${r.cat}`).join('\n');
    download('balance_cuadra.csv',texto,'text/csv;charset=utf-8');
    cuaLog(`[${e.name}] exportó balance a CSV`);flash('Balance exportado a CSV');return;
  }
  if(a==='addMpm'){
    const nom=($('#cuaMpmName')?.value||'').trim(),sub=$('#cuaMpmSub')?.value||'op',val=Number($('#cuaMpmVal')?.value)||0;
    if(!nom){flash('Nombre del MPM requerido');return}
    if((state.localUser||'preparador')!=='preparador'){flash('Solo el preparador define MPM');return}
    c.mpms.push({name:nom,sub,val,status:'draft',approvedBy:null});
    cuaLog(`preparador definió MPM "${nom}"`);save();render();return;
  }
  if(a==='approveMpm'){
    if((state.localUser||'preparador')!=='revisor'){flash('Solo el revisor aprueba (segregación de funciones)');return}
    if(!c.mpms[i])return;
    c.mpms[i].status='approved';c.mpms[i].approvedBy='revisor';
    cuaLog(`revisor aprobó MPM "${c.mpms[i].name}"`);save();render();return;
  }
  if(a==='delMpm'){if(!c.mpms[i])return;cuaLog(`eliminó MPM "${c.mpms[i].name}"`);c.mpms.splice(i,1);save();render();return}
  if(a==='populateNotes'){
    const x=cuaCalc(cuaFilas()),ent=cuaEntActual();
    const det=cuaFilas().filter(r=>r.cat==='operating').map(r=>`${r.name}: ${cuaMoney(r.amt)}`).join('; ');
    c.notas=[
      {t:'Nota 1 · Resultado de operación',x:`El resultado de operación asciende a ${cuaMoney(x.op)}. Composición por partida (efecto en resultado): ${det||'—'}.`},
      {t:'Nota 2 · Categoría de inversión',x:`Partidas de inversión por ${cuaMoney(x.by.investing)} (dividendos, intereses y resultado por venta de activos).`},
      {t:'Nota 3 · Categoría de financiación',x:`Costos de financiación netos por ${cuaMoney(x.by.financing)}.`},
      {t:'Nota 4 · Impuesto y resultado',x:`Resultado antes de impuestos ${cuaMoney(x.pbt2)}; impuesto ${cuaMoney(x.by.income_tax)}; resultado del periodo ${cuaMoney(x.profit2)}.`}
    ];
    c.notasStale=false;cuaLog(`[${ent.name}] pobló las notas (4)`);save();render();return;
  }
}
function cuaEntrada(el){
  const e=cuaEntActual();if(e.principal)return;
  const [i,k]=el.dataset.cuaCell.split(':');

  f[k]=k==='amt'?(el.value===''?0:Number(el.value)):el.value;
  if(cuaEstado().notas.length)cuaEstado().notasStale=true;
  save();cuaRecalcular();
}
function cuaCambio(el){
  const tipo=el.dataset.cua,c=cuaEstado();
  if(tipo==='ent'){c.ent=Number(el.value);save();render();return}
  if(tipo==='cat'){
    const e=cuaEntActual();if(e.principal)return;
    const i=Number(el.dataset.i),f=e.rows[i];if(!f)return;
    f.cat=el.value;
    cuaLog(`[${e.name}] clasificó ${f.code||'(s/código)'} → ${el.value||'sin clasificar'}`);
    if(c.notas.length)c.notasStale=true;
    save();cuaRecalcular();return;
  }
}
function cuaCambioCelda(el){
  const e=cuaEntActual();if(e.principal)return;

  const campo=k==='code'?'código':k==='name'?'nombre':'efecto';
  cuaLog(`[${e.name}] editó ${campo} de partida ${f.code||'(s/código)'}`);
}

if(a==='saveBrief'){state.brief=$('#brief').value;save();flash('Comentario guardado');return}
if(a==='saveStageNote'){let key=currentRoute();state.stageNotes=state.stageNotes||{};state.stageNotes[key]=$('#stageNote').value;save();flash('Preparación del módulo guardada localmente');return}
if(a==='exportPrelim'){let b=bridge();download('NIIF18_Informe_Preliminar_DEMO.txt',`SIMULACIÓN LOCAL - NO INFORME EMITIDO\nEmpresa: ${state.company.name}\nSector: ${state.company.sector}\nAvance cuestionario: ${progress()}%\nResultado fuente: ${fmt(b.previous)} USD\nPartidas pendientes: ${state.accounts.filter(x=>x.category==='Pendiente').length}\nComentario: ${state.brief}\nSIN REVISIÓN INDEPENDIENTE NI MOTOR AUDITBRAIN.`);return}
if(['savePaper','submitPaper','approvePaper','rejectPaper','exportPaper'].includes(a)){const pt=currentRoute().split('/')[1],r=state.papers[pt]||{status:'borrador',notes:'',evidence:'',version:1};if(!pt)return;
 if(a==='savePaper'||a==='submitPaper'){if(state.localUser!=='preparador'){flash('Selecciona rol preparador');return}let n=$('#paperNotes').value,ev=$('#paperEvidence').value;if((r.notes!==n||r.evidence!==ev)&&['enviado','aprobado'].includes(r.status)){r.version=(r.version||1)+1;r.status='borrador';audit(pt,'Revisión invalidada por edición','preparador')}r.notes=n;r.evidence=ev;if(a==='submitPaper'){if(!r.notes.trim()||!r.evidence.trim()){flash('Se exige procedimiento y referencia de evidencia');return}r.status='enviado';audit(pt,'Enviado a revisión','preparador')}else audit(pt,'Borrador guardado','preparador');state.papers[pt]=r;save();render();flash(a==='submitPaper'?'Enviado a revisión (demo)':'Guardado local');return}
 if(a==='approvePaper'||a==='rejectPaper'){if(state.localUser!=='revisor'){flash('Solo rol Revisor de prueba');return}if(r.status!=='enviado'){flash('Debe estar enviado a revisión');return}if(a==='rejectPaper'&&!$('#reviewNote').value.trim()){flash('Registra motivo de devolución');return}r.reviewNote=$('#reviewNote').value;r.status=a==='approvePaper'?'aprobado':'observado';audit(pt,a==='approvePaper'?'Aprobado (DEMO)':'Devuelto','revisor');state.papers[pt]=r;save();render();flash('Decisión registrada localmente');return}
 if(a==='exportPaper'){download(pt+'_Constancia_DEMO.txt',`CONSTANCIA LOCAL - NO DOCUMENTO APROBADO POR AUDITCONSULTING\n${pt}: ${PT.find(x=>x[0]===pt)?.[1]}\nEstado: ${r.status}\nVersión: ${r.version}\nProcedimiento: ${r.notes}\nEvidencia referida: ${r.evidence}`);return}}
if(a==='ingestFiles'){const list=[...($('#fileUpload')?.files||[])];if(!list.length){flash('Selecciona archivos');return}Promise.all(list.map(async f=>{let buf=await f.arrayBuffer(),hash=await crypto.subtle.digest('SHA-256',buf);const sha=[...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('');return{name:f.name,size:f.size,date:new Date().toISOString(),sha}})).then(xs=>{state.files.push(...xs);save();render();flash(xs.length+' metadatos registrados')}).catch(()=>flash('No se pudo calcular SHA-256; abre mediante localhost o HTTPS'));return}
if(a==='removeFile'){state.files.splice(Number(b.dataset.i),1);save();render();return}
if(a==='searchKnowledge'){const q=$('#knowledgeQuery').value.trim();state.knowledgeQuery=q;state.knowledgeResults=queryKnowledge(q);save();render();return}
}
function change(e){if(e.target.matches('[data-cua]')){cuaCambio(e.target);return}if(e.target.matches('[data-cua-cell]')){cuaCambioCelda(e.target);return}if(e.target.matches('[data-answer]')){state.answers[e.target.dataset.answer]=e.target.value;save();return}
if(e.target.id==='demoStage2'){state.stage2=e.target.checked;save();render();return}
if(e.target.id==='questionPT'){state.activePT=e.target.value;save();render();return}
if(e.target.matches('[data-stage-task]')){let [k,i]=e.target.dataset.stageTask.split(':');state.stageTasks=state.stageTasks||{};let a=new Set(state.stageTasks[k]||[]);e.target.checked?a.add(Number(i)):a.delete(Number(i));state.stageTasks[k]=[...a];save();render();return}
if(e.target.id==='roleSelect'){state.localUser=e.target.value;save();render();return}
if(e.target.matches('[data-cell]')){const [i,key]=e.target.dataset.cell.split(':');state.accounts[Number(i)][key]=key==='amount'?Number(e.target.value):e.target.value;save();return}
if(e.target.id==='csvInput'){const f=e.target.files[0];if(!f)return;f.text().then(t=>{let rows=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(rows.length>501){flash('Máximo 500 registros');return}let parsed=rows.slice(1).map((l,i)=>{let parts=l.includes(';')?l.split(';'):l.split(',');return{id:'i'+i+Date.now(),code:(parts[0]||'').replace(/"/g,'').trim(),name:(parts[1]||'').replace(/"/g,'').trim(),amount:Number((parts[2]||'0').replace(/"/g,'').trim())||0,category:['Operación','Inversión','Financiación','Impuesto','Discontinuadas','Pendiente'].includes((parts[3]||'').trim())?(parts[3]||'').trim():'Pendiente',basis:(parts[4]||'').replace(/"/g,'').trim()}});if(!parsed.length){flash('CSV sin filas');return}state.accounts=parsed;save();render();flash(parsed.length+' filas importadas (local)')});return}}
function input(e){if(e.target.matches('[data-cua-cell]')){cuaEntrada(e.target);return}if(e.target.matches('[data-norma-buscar]')){const q=e.target.value.trim().toLowerCase();document.querySelectorAll('[data-norma]').forEach(n=>{n.style.display=(!q||n.dataset.norma.includes(q))?'':'none'});return}if(e.target.matches('[data-note]')){state.answerNotes[e.target.dataset.note]=e.target.value;save()}}
function question(e){e.preventDefault();let t=$('#agentMessage')?.value.trim();if(!t)return;state.agentChat.push({role:'user',text:t});let hits=queryKnowledge(t);let ans=hits.length?`Encontré ${hits.length} referencia(s) relacionadas en el Manual Maestro V5.2 de Auditconsulting:\n\n${hits.map(h=>`• Página ${h.page}: ${h.text.slice(0,230)}…`).join('\n\n')}\n\nEstos son fragmentos recuperados, no una interpretación normativa validada. Para responder con razonamiento y fuentes externas se requiere el agente RAG conectado a AuditBrain.`:'No encontré un extracto suficientemente relacionado en la base metodológica local. Debe consultarse la norma oficial o el revisor de Auditconsulting; no inferiré una respuesta.';state.agentChat.push({role:'bot',text:ans});state.agentChat=state.agentChat.slice(-18);save();render()}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});document.addEventListener('click',action);document.addEventListener('change',change);document.addEventListener('input',input);document.addEventListener('submit',e=>{if(e.target.id==='agentForm')question(e)});(async()=>{if(!state.cuadra){state.cuadra=cuaSemilla();save()}render();await cargarSesion();await cargarManifiesto();render()})();})();

</script></body></html>
