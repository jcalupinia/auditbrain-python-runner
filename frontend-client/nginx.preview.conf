# nginx de la imagen de PREVIEW del portal de clientes: SPA de Vite con fallback a index.html
# (equivalente al `routes: rewrite` de Render). Solo escucha dentro del contenedor; Traefik enruta.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /build-info.json { default_type application/json; add_header Cache-Control "no-store"; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
