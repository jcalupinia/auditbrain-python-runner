name: preview-cleanup

# Al cerrar o fusionar un Pull Request elimina EXCLUSIVAMENTE su preview en Coolify (`cerrar --pr N` de
# scripts/preview_lifecycle.py), tras verificar su identidad: el PR ya no está abierto en GitHub, es del propio
# repositorio y la aplicación de previews tiene un preview con ESE número. Nunca toca otra aplicación.
#
# pull_request_target: el workflow y el script se ejecutan desde la rama base protegida (código confiable) y NO se
# hace checkout del código del PR. Interruptor: PREVIEW_PIPELINE_ENABLED. Mismo candado que la admisión
# (concurrency preview-admision) para no cruzarse con un despliegue del mismo PR.

on:
  pull_request_target:
    branches: [main]
    types: [closed]

concurrency:
  group: preview-admision
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  cerrar:
    name: eliminar el preview del PR cerrado
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: vars.PREVIEW_PIPELINE_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Código confiable (rama base, nunca el PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cerrar el preview del PR ${{ github.event.pull_request.number }}
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL || vars.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_PREVIEW_APP_UUID: ${{ secrets.COOLIFY_PREVIEW_APP_UUID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          case "$COOLIFY_URL" in https://*) ;; *) echo "::error::COOLIFY_URL no es https://. Abortado."; exit 1 ;; esac
          python scripts/preview_lifecycle.py cerrar --pr "$PR"
