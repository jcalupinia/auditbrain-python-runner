name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Solo una ejecución por rama: cancela la anterior si llega un push nuevo.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (chromium · 59 tests)
    # Fijado a 24.04: `ubuntu-latest` ya resuelve a 26.04, que Playwright 1.56
    # no soporta para instalar navegadores (`npx playwright install --with-deps`
    # falla con «Playwright does not support chromium on ubuntu26.04-x64»). 24.04
    # es la última versión soportada por esta versión de Playwright. Al subir
    # Playwright se puede volver a `ubuntu-latest`.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        working-directory: e2e
        run: npx playwright test --reporter=list,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
