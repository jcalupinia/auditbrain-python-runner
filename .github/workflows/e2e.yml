name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Solo una ejecución por rama: cancela la anterior si llega un push nuevo.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (chromium · 59 tests)
    # Fijado a 24.04: el runner `ubuntu-latest` pasó a Ubuntu 26.04 y Playwright 1.56.1 no soporta
    # instalar Chromium ahí (`npx playwright install --with-deps chromium` falla en ubuntu26.04-x64).
    # 24.04 (Noble) sí está soportado. Revertir a `ubuntu-latest` cuando Playwright soporte 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        working-directory: e2e
        run: npx playwright test --reporter=list,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
