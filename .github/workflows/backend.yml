name: backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # La suite completa (~2.900 tests, papeles NIIF de las 20 herramientas y la planificación
    # NIA en todos los formatos) tardaba ~17-20 min en UN runner. Ahora se reparte en 4 grupos
    # con pytest-split: cada grupo corre en su PROPIO runner (checkout, base SQLite y /tmp
    # aislados → sin colisión de estado), con COBERTURA COMPLETA, y el tiempo de pared baja a
    # ~5 min. El reparto es por conteo (determinista); si algún día se sube un `.test_durations`
    # al repo, pytest-split lo usa para balancear por tiempo.
    name: pytest (python 3.12) · grupo ${{ matrix.group }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-prod.txt

      - name: Install runtime deps (prod)
        run: pip install -r requirements-prod.txt

      - name: Install test deps
        run: pip install -r requirements-dev.txt

      - name: Run pytest (grupo ${{ matrix.group }} de 4)
        run: pytest tests/ -q --tb=short --splits 4 --group ${{ matrix.group }}
