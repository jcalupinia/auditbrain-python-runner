name: backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (python 3.12)
    runs-on: ubuntu-latest
    # La suite completa ya tarda ~19-20 min en el runner (2368 tests, papeles NIIF de las
    # 20 herramientas y la planificación NIA en todos los formatos). Con 20 min se cancelaba
    # justo al terminar (PR #171: 2368 pasaron en 19:16 y el trabajo se canceló igual).
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-prod.txt

      - name: Install runtime deps (prod)
        run: pip install -r requirements-prod.txt

      - name: Install test deps
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -q --tb=short
