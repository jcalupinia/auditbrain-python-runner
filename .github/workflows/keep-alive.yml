name: keep-alive

# ==========================================================================
# RE-ACTIVADO — 2026-10-07. Lee esto antes de volver a tocarlo.
#
# QUÉ HACE
#   Un `curl` al endpoint LIGERO de salud cada 10 minutos:
#     https://auditbrain-python-runner.onrender.com/healthz
#   Nada más: sin checkout, sin instalar dependencias, sin ejecutar código
#   del repo, sin tocar Postgres, sin importar módulos opcionales. Su único
#   propósito es mantener el servicio despierto para que los auditores no se
#   topen con el «arranque en frío» de Render (el servicio se suspende tras
#   ~15 min sin tráfico y la primera petición tarda ~30-60 s en responder).
#
# POR QUÉ SE RE-ACTIVA (y por qué ahora es seguro)
#   1. El servicio volvió a dormirse por inactividad (síntoma reportado por
#      el usuario: «No se pudo conectar con el servidor… arranque en frío»,
#      que además deja grises los botones de descarga porque la vista no
#      alcanza a cargar el resultado de la prueba). Si el backend vuelve a
#      un plan que NO se suspende, este cron es inofensivo (un GET liviano)
#      y se puede volver a desactivar.
#   2. La preocupación histórica de MEMORIA queda atendida: aquel keep-alive
#      pingaba `/api/v1/health`, que con `try: import X` dejaba grpcio +
#      protobuf + pbixray + pyqvd + anthropic residentes para siempre. Este
#      apunta a `/healthz`, que NO importa módulos ni toca la base. Además la
#      causa de fondo ya está corregida (backend/app/utils/module_probe.py).
#
# ALTERNATIVA MÁS ROBUSTA
#   Un monitor externo de uptime (p. ej. UptimeRobot) contra `/healthz` cada
#   5 min, o subir el plan de Render a uno siempre-encendido. Los cron de
#   GitHub Actions pueden retrasarse en horas pico; para producción crítica,
#   preferir el monitor externo o el plan de pago.
#
# CÓMO DESACTIVARLO
#   Quitar el bloque `schedule` de abajo (dejando `workflow_dispatch` para el
#   ping manual), o borrar este archivo.
#
# Los otros workflows (backend.yml → pytest, e2e.yml → Playwright) son
# independientes y no dependen de éste.
# ==========================================================================

on:
  schedule:
    # Cada 10 minutos: por debajo del umbral de ~15 min de suspensión de Render.
    - cron: "*/10 * * * *"
  # Disparo manual, por si hace falta comprobar el servicio a mano.
  workflow_dispatch: {}

# Un solo ping a la vez: si una corrida se solapa con la anterior, cancela la vieja.
concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Mantener el backend despierto (GET /healthz)
        run: |
          curl -fsS --max-time 30 \
            --retry 3 --retry-all-errors --retry-delay 5 \
            "https://auditbrain-python-runner.onrender.com/healthz" \
            && echo "Backend operativo ✓" \
            || { echo "El backend no respondió"; exit 1; }
