name: preview-validate

# Validación de los artefactos de Preview Environments SIN desplegar ni publicar nada:
#  - `docker compose config` del Compose de previews con valores ficticios;
#  - construcción (sin push) de las tres imágenes con el commit del PR, comprobando que el
#    commit queda en la metadata OCI y en build-info.json;
#  - pruebas de resolución del backend por hostname en los dos frontends.
# Corre solo cuando cambian esos artefactos. No usa secretos ni tokens.

on:
  pull_request:
    branches: [main]
    paths:
      - docker-compose.preview.yml
      - Dockerfile.render
      - frontend/Dockerfile.preview
      - frontend/Dockerfile.preview.dockerignore
      - frontend/nginx.preview.conf
      - frontend/src/previewResolver.js
      - frontend/src/previewResolver.test.js
      - frontend/src/api.js
      - frontend-client/Dockerfile.preview
      - frontend-client/Dockerfile.preview.dockerignore
      - frontend-client/nginx.preview.conf
      - frontend-client/src/previewResolver.js
      - frontend-client/src/previewResolver.test.mjs
      - frontend-client/src/api.js
      - backend/app/core/preview.py
      - backend/app/core/hostnames.py
      - .github/workflows/preview-*.yml
  workflow_dispatch: {}

concurrency:
  group: preview-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose-config:
    name: docker compose config (valores ficticios)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validar el Compose con valores ficticios (no se levanta nada)
        env:
          PREVIEW_IMAGE_TAG: sha-0000000000000000000000000000000000000000
          SERVICE_FQDN_BACKEND_10000: 0.api.preview.audit-ia.ec
          SERVICE_FQDN_CONSOLA_80: 0.consola.preview.audit-ia.ec
          SERVICE_FQDN_CLIENTES_80: 0.clientes.preview.audit-ia.ec
        run: |
          docker compose -f docker-compose.preview.yml config -q
          docker compose -f docker-compose.preview.yml config | tee /tmp/compose-resuelto.yml | head -c 0
          echo "Servicios:"; docker compose -f docker-compose.preview.yml config --services
          # Fallo seguro: sin PREVIEW_IMAGE_TAG el Compose debe rechazarse
          if PREVIEW_IMAGE_TAG= docker compose -f docker-compose.preview.yml config -q 2>/dev/null; then
            echo "ERROR: el Compose aceptó PREVIEW_IMAGE_TAG vacío"; exit 1; fi
          echo "OK: PREVIEW_IMAGE_TAG vacío es rechazado"
          grep -q 'ghcr.io/jcalupinia/auditbrain-preview-backend:sha-0000' /tmp/compose-resuelto.yml
          # Credenciales de prueba exclusivas por PR: el Compose ya no depende de variables compartidas de Coolify
          if grep -E 'PREVIEW_ADMIN_(EMAIL|PASSWORD)|PREVIEW_API_KEY' /tmp/compose-resuelto.yml; then
            echo "ERROR: el Compose aún referencia variables compartidas de credenciales"; exit 1; fi
          grep -q 'preview-admin@audit-ia.ec' /tmp/compose-resuelto.yml
          echo "OK: sin PREVIEW_ADMIN_*/PREVIEW_API_KEY; correo del administrador de prueba fijo"

  init-secrets:
    name: generador de secretos de init (alpine real, dos volúmenes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar el command real de init en alpine:3.20 (nada se publica ni se despliega)
        env:
          PREVIEW_IMAGE_TAG: sha-0000000000000000000000000000000000000000
          SERVICE_FQDN_BACKEND_10000: 0.api.preview.audit-ia.ec
          SERVICE_FQDN_CONSOLA_80: 0.consola.preview.audit-ia.ec
          SERVICE_FQDN_CLIENTES_80: 0.clientes.preview.audit-ia.ec
        run: |
          set -euo pipefail
          # El guion es exactamente el del Compose (sin el sleep final que lo mantiene vivo)
          docker compose -f docker-compose.preview.yml config --format json \
            | jq -r '.services.init.command[2]' | sed 's/exec sleep infinity//' > /tmp/init.sh
          grep -q 'gen api_key 48' /tmp/init.sh
          docker volume create pv_a >/dev/null; docker volume create pv_b >/dev/null
          run() { docker run --rm -v "$1:/secrets" -v /tmp/init.sh:/init.sh:ro alpine:3.20 sh /init.sh; }
          # Inspección sin imprimir valores: permisos, tamaño, bytes no alfanuméricos y huella
          insp() { docker run --rm -v "$1:/secrets:ro" alpine:3.20 sh -c '
              cd /secrets; stat -c "dir %a" .; printf "tmp %s\n" "$(ls -A | grep -c "\.tmp$" || true)"
              for f in pg_password jwt_secret admin_password api_key; do
                printf "%s perm=%s bytes=%s noalnum=%s\n" "$f" "$(stat -c %a $f)" "$(stat -c %s $f)" "$(tr -d "A-Za-z0-9" < $f | wc -c)"
              done; sha256sum pg_password jwt_secret admin_password api_key'; }
          out1=$(run pv_a); echo "salida 1: $out1"; [ "$out1" = "secrets listos" ]
          insp pv_a | tee /tmp/a1.txt
          grep -q '^dir 700$' /tmp/a1.txt; grep -q '^tmp 0$' /tmp/a1.txt
          grep -q '^pg_password perm=600 bytes=40 noalnum=0$' /tmp/a1.txt
          grep -q '^jwt_secret perm=600 bytes=64 noalnum=0$' /tmp/a1.txt
          grep -q '^admin_password perm=600 bytes=32 noalnum=0$' /tmp/a1.txt
          grep -q '^api_key perm=600 bytes=48 noalnum=0$' /tmp/a1.txt
          out2=$(run pv_a); [ "$out2" = "secrets listos" ]
          insp pv_a > /tmp/a2.txt; cmp /tmp/a1.txt /tmp/a2.txt && echo "OK: idempotente (redespliegue del mismo PR no regenera nada)"
          run pv_b >/dev/null; insp pv_b > /tmp/b1.txt
          for f in pg_password jwt_secret admin_password api_key; do
            ha=$(grep " $f$" /tmp/a1.txt | cut -c1-64); hb=$(grep " $f$" /tmp/b1.txt | cut -c1-64)
            [ "$ha" != "$hb" ] || { echo "ERROR: $f coincide entre dos volúmenes (dos PR)"; exit 1; }
          done
          echo "OK: independencia por PR (4/4 valores distintos entre dos volúmenes)"
          # La salida del guion no contiene ningún secreto (se compara dentro del contenedor, sin imprimirlos)
          docker run --rm -v pv_a:/secrets:ro -e OUT="$out1$out2" alpine:3.20 sh -c '
            for f in /secrets/*; do v=$(cat "$f"); case "$OUT" in *"$v"*) echo "ERROR: la salida contiene un secreto"; exit 1;; esac; done
            echo "OK: la salida no contiene secretos"'
          docker volume rm pv_a pv_b >/dev/null

  build-images:
    name: build sin push · ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: Dockerfile.render
            check: 'python -c "import os,sys; sys.exit(0 if os.environ.get(\"BUILD_COMMIT\")==os.environ[\"ESPERADO\"] else 1)"'
          - service: consola
            dockerfile: frontend/Dockerfile.preview
            check: 'sh -c "grep -q \"$ESPERADO\" /usr/share/nginx/html/build-info.json && grep -q preview-backend-no-resuelto.invalid /usr/share/nginx/html/assets/*.js"'
          - service: clientes
            dockerfile: frontend-client/Dockerfile.preview
            check: 'sh -c "grep -q \"$ESPERADO\" /usr/share/nginx/html/build-info.json && grep -q preview-backend-no-resuelto.invalid /usr/share/nginx/html/assets/*.js"'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir (sin publicar) con el commit del PR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: local/auditbrain-${{ matrix.service }}:validate
          build-args: |
            GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=preview-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=preview-${{ matrix.service }}
      - name: Verificar commit en metadata OCI y en la imagen
        env:
          ESPERADO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          REV=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' local/auditbrain-${{ matrix.service }}:validate)
          echo "revision=$REV esperado=$ESPERADO"
          test "$REV" = "$ESPERADO"
          docker run --rm -e ESPERADO="$ESPERADO" local/auditbrain-${{ matrix.service }}:validate ${{ matrix.check }}
          docker image ls local/auditbrain-${{ matrix.service }}:validate

  resolvers:
    name: pruebas de resolución del backend (frontends)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Consola (vitest)
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npx vitest run src/previewResolver.test.js
      - name: Portal (node:test, sin dependencias)
        run: node --test frontend-client/src/previewResolver.test.mjs
