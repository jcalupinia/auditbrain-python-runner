name: preview-images

# Construye y PUBLICA en GHCR las tres imágenes de un Pull Request con el commit exacto
# (etiqueta inmutable sha-<sha completo> y alias pr-<n>).
#
# DESHABILITADO PARA EJECUCIÓN REAL: solo se dispara a mano (workflow_dispatch) y además exige la
# variable de repositorio PREVIEW_PIPELINE_ENABLED == "true", que NO existe hasta que haya
# aprobación administrativa independiente. Sin esa variable, el workflow termina sin publicar.
# Los paquetes GHCR deben configurarse como PRIVADOS (decisión D11); el servidor de previews
# los leerá con una credencial de solo lectura que se creará más adelante (no en este PR).

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número del Pull Request cuyas imágenes se publican"
        required: true
        type: string

concurrency:
  group: preview-images-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  guard:
    name: puerta de habilitación
    runs-on: ubuntu-latest
    outputs:
      habilitado: ${{ steps.g.outputs.habilitado }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      es_fork: ${{ steps.pr.outputs.es_fork }}
    steps:
      - id: g
        run: |
          if [ "${{ vars.PREVIEW_PIPELINE_ENABLED }}" = "true" ]; then echo "habilitado=true" >> "$GITHUB_OUTPUT";
          else echo "habilitado=false" >> "$GITHUB_OUTPUT"; echo "::notice::PREVIEW_PIPELINE_ENABLED no es 'true': no se publica nada"; fi
      - id: pr
        if: steps.g.outputs.habilitado == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          json=$(gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}")
          echo "head_sha=$(echo "$json" | jq -r .head.sha)" >> "$GITHUB_OUTPUT"
          repo=$(echo "$json" | jq -r .head.repo.full_name)
          if [ "$repo" != "${{ github.repository }}" ]; then echo "es_fork=true" >> "$GITHUB_OUTPUT"; else echo "es_fork=false" >> "$GITHUB_OUTPUT"; fi

  build-push:
    name: publicar · ${{ matrix.service }}
    needs: guard
    if: needs.guard.outputs.habilitado == 'true' && needs.guard.outputs.es_fork == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: backend
            dockerfile: Dockerfile.render
          - service: consola
            dockerfile: frontend/Dockerfile.preview
          - service: clientes
            dockerfile: frontend-client/Dockerfile.preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar con el commit exacto del PR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/jcalupinia/auditbrain-${{ matrix.service }}:sha-${{ needs.guard.outputs.head_sha }}
            ghcr.io/jcalupinia/auditbrain-${{ matrix.service }}:pr-${{ inputs.pr_number }}
          labels: |
            org.opencontainers.image.revision=${{ needs.guard.outputs.head_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            GIT_SHA=${{ needs.guard.outputs.head_sha }}
          cache-from: type=gha,scope=preview-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=preview-${{ matrix.service }}
      - name: Resumen
        run: echo "ghcr.io/jcalupinia/auditbrain-${{ matrix.service }}:sha-${{ needs.guard.outputs.head_sha }}" >> "$GITHUB_STEP_SUMMARY"
