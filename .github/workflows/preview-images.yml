name: preview-images

# Construye y PUBLICA en GHCR las tres imágenes PRIVADAS de un Pull Request con el commit exacto
# (una sola etiqueta inmutable por imagen: sha-<sha completo>; sin `latest` ni alias):
#   ghcr.io/jcalupinia/auditbrain-preview-backend | -consola | -clientes
#
# POR QUÉ NO SE USA GITHUB_TOKEN PARA PUBLICAR (2026-10-15): «el paquete hereda el modelo de
# visibilidad y permisos del repositorio donde corre el workflow» (docs de GitHub Packages). Este
# repositorio es público, así que los paquetes auditbrain-backend|consola|clientes creados con
# GITHUB_TOKEN nacieron PÚBLICOS. Esos nombres no se reutilizan. Los paquetes nuevos se crean con una
# credencial dedicada de alcance mínimo (PAT classic con `write:packages`, creada y guardada por el
# propietario como secreto de Actions GHCR_PUBLISH_TOKEN; nunca en el repositorio ni en el chat): un
# paquete nuevo publicado así nace PRIVADO y el vínculo con el repositorio solo hereda permisos, no
# visibilidad. Este workflow NO concede `packages: write` a GITHUB_TOKEN.
#
# PUBLICACIÓN POR ETAPAS Y VERIFICADA: primero solo el backend (etiqueta
# ghcr-preview-pr384-backend-<sha>); tras cada push el propio job comprueba con la credencial que la
# visibilidad del paquete es `private` y que el manifiesto NO se descarga de forma anónima; si algo
# falla, el job falla y no se publica nada más. Los frontends (ghcr-preview-pr384-frontends-<sha>)
# solo se publican si el backend de ESE commit ya existe y es privado.
#
# Puerta de validación común (si no se cumple TODO, termina sin publicar): repositorio exacto; evento
# push de etiqueta con el formato indicado y un SHA de 40 caracteres; la etiqueta apunta
# (desreferenciada por la API) a ese SHA; el PR #384 está abierto, sin fusionar, contra main, no
# proviene de un fork y su HEAD actual es ese SHA; la credencial existe, pertenece al propietario del
# espacio de nombres y tiene `write:packages`.
#
# workflow_dispatch: DESHABILITADO mientras la variable de repositorio PREVIEW_PIPELINE_ENABLED no sea
# "true" (no existe hasta que haya aprobación administrativa independiente).

on:
  push:
    tags:
      - "ghcr-preview-pr384-backend-*"
      - "ghcr-preview-pr384-frontends-*"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número del Pull Request cuyas imágenes se publican"
        required: true
        type: string
      etapa:
        description: "backend | frontends"
        required: true
        type: choice
        options: [backend, frontends]

concurrency:
  group: preview-images-${{ github.ref }}
  cancel-in-progress: false

# GITHUB_TOKEN solo lee el repositorio: sin packages:write no puede crear paquetes (serían públicos).
permissions:
  contents: read

env:
  REPO_AUTORIZADO: jcalupinia/auditbrain-python-runner
  PR_AUTORIZADO: "384"
  GHCR_OWNER: jcalupinia
  PREFIJO_PAQUETE: auditbrain-preview-

jobs:
  guard:
    name: puerta de habilitación
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      habilitado: ${{ steps.tag.outputs.habilitado || steps.dispatch.outputs.habilitado || 'false' }}
      head_sha: ${{ steps.tag.outputs.head_sha || steps.dispatch.outputs.head_sha }}
      etapa: ${{ steps.tag.outputs.etapa || steps.dispatch.outputs.etapa }}
      matriz: ${{ steps.matriz.outputs.matriz }}
    steps:
      - name: Credencial de publicación dedicada (existe, es del propietario y tiene write:packages)
        id: cred
        env:
          GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          rechazar() { echo "::error::RECHAZADO sin publicar: $1"; exit 1; }
          [ -n "${GHCR_PUBLISH_TOKEN:-}" ] || rechazar "falta el secreto de Actions GHCR_PUBLISH_TOKEN (lo crea el propietario; nunca se usa GITHUB_TOKEN para publicar)"
          cab=$(mktemp)
          code=$(curl -sS -o /tmp/me.json -D "$cab" -w '%{http_code}' -H "Authorization: Bearer $GHCR_PUBLISH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/user)
          [ "$code" = "200" ] || rechazar "la credencial no autentica contra api.github.com (HTTP $code)"
          login=$(jq -r .login /tmp/me.json)
          [ "$login" = "$GHCR_OWNER" ] || rechazar "la credencial pertenece a '$login', no al propietario del espacio de nombres '$GHCR_OWNER'"
          scopes=$(grep -i '^x-oauth-scopes:' "$cab" | cut -d: -f2- | tr -d ' \r')
          echo "alcances de la credencial: ${scopes:-<ninguno>}"
          echo ",$scopes," | grep -q ",write:packages," || rechazar "la credencial no tiene el alcance write:packages (¿es un token fine-grained? debe ser classic)"
          extra=$(echo "$scopes" | tr ',' '\n' | grep -vE '^(read:packages|write:packages)$' | paste -sd, - || true)
          [ -z "$extra" ] || echo "::warning::la credencial tiene alcances adicionales a los mínimos: $extra (recomendado: solo write:packages)"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Puerta de la publicación por etiqueta (PR 384)
        id: tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
          EVENT_REPO: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rechazar() { echo "::error::RECHAZADO sin publicar: $1"; echo "habilitado=false" >> "$GITHUB_OUTPUT"; exit 1; }
          [ "$EVENT_REPO" = "$REPO_AUTORIZADO" ] || rechazar "repositorio $EVENT_REPO distinto de $REPO_AUTORIZADO"
          [ "${GITHUB_REF_TYPE:-}" = "tag" ] || rechazar "el evento no es un push de etiqueta (${GITHUB_REF_TYPE:-?})"
          TAG="${GITHUB_REF_NAME}"
          if   [[ "$TAG" =~ ^ghcr-preview-pr${PR_AUTORIZADO}-(backend|frontends)-([0-9a-f]{40})$ ]]; then ETAPA="${BASH_REMATCH[1]}"; SHA="${BASH_REMATCH[2]}";
          else rechazar "etiqueta '$TAG' sin el formato ghcr-preview-pr${PR_AUTORIZADO}-(backend|frontends)-<sha de 40 caracteres>"; fi
          # La etiqueta debe apuntar exactamente al SHA de su nombre (si es anotada, se desreferencia).
          ref_json=$(gh api "repos/$REPO_AUTORIZADO/git/ref/tags/$TAG")
          obj_type=$(jq -r .object.type <<<"$ref_json"); obj_sha=$(jq -r .object.sha <<<"$ref_json")
          if [ "$obj_type" = "tag" ]; then commit=$(gh api "repos/$REPO_AUTORIZADO/git/tags/$obj_sha" --jq .object.sha); else commit="$obj_sha"; fi
          [ "$commit" = "$SHA" ] || rechazar "la etiqueta apunta a $commit, no al SHA de su nombre ($SHA)"
          echo "github.sha del evento: $EVENT_SHA (informativo; la referencia válida es la etiqueta desreferenciada)"
          # El PR autorizado: abierto, sin fusionar, contra main, sin fork y con ese HEAD exacto.
          pr_json=$(gh api "repos/$REPO_AUTORIZADO/pulls/$PR_AUTORIZADO")
          [ "$(jq -r .state <<<"$pr_json")" = "open" ] || rechazar "el PR $PR_AUTORIZADO no está abierto"
          [ "$(jq -r .merged <<<"$pr_json")" = "false" ] || rechazar "el PR $PR_AUTORIZADO está fusionado"
          [ "$(jq -r .base.ref <<<"$pr_json")" = "main" ] || rechazar "el PR $PR_AUTORIZADO no apunta a main"
          [ "$(jq -r .head.repo.full_name <<<"$pr_json")" = "$REPO_AUTORIZADO" ] || rechazar "el PR $PR_AUTORIZADO proviene de un fork"
          head_sha=$(jq -r .head.sha <<<"$pr_json")
          [ "$head_sha" = "$SHA" ] || rechazar "el HEAD actual del PR ($head_sha) no es el SHA de la etiqueta ($SHA)"
          # Etapa frontends: el backend de ESE commit debe existir ya y ser PRIVADO.
          if [ "$ETAPA" = "frontends" ]; then
            pkg="${PREFIJO_PAQUETE}backend"
            code=$(curl -sS -o /tmp/pkg.json -w '%{http_code}' -H "Authorization: Bearer $GHCR_PUBLISH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/user/packages/container/$pkg")
            [ "$code" = "200" ] || rechazar "el paquete $pkg no existe todavía (HTTP $code): publique primero la etapa backend"
            vis=$(jq -r .visibility /tmp/pkg.json)
            [ "$vis" = "private" ] || rechazar "el paquete $pkg es '$vis', no 'private': no se publican los frontends"
            curl -sS -H "Authorization: Bearer $GHCR_PUBLISH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/user/packages/container/$pkg/versions?per_page=100" \
              | jq -e --arg t "sha-$SHA" '[.[] | .metadata.container.tags[]?] | index($t) != null' >/dev/null \
              || rechazar "el paquete $pkg no tiene la versión sha-$SHA de este commit"
            echo "backend de $SHA presente y privado"
          fi
          echo "AUTORIZADO: etiqueta $TAG -> etapa $ETAPA, commit $SHA = HEAD del PR $PR_AUTORIZADO"
          { echo "habilitado=true"; echo "head_sha=$SHA"; echo "etapa=$ETAPA"; } >> "$GITHUB_OUTPUT"

      - name: Puerta de workflow_dispatch (deshabilitada sin PREVIEW_PIPELINE_ENABLED)
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ETAPA: ${{ inputs.etapa }}
          EVENT_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ vars.PREVIEW_PIPELINE_ENABLED }}" != "true" ]; then
            echo "::notice::PREVIEW_PIPELINE_ENABLED no es 'true': no se publica nada"
            echo "habilitado=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ "$EVENT_REPO" = "$REPO_AUTORIZADO" ] || { echo "::error::repositorio no autorizado"; echo "habilitado=false" >> "$GITHUB_OUTPUT"; exit 1; }
          json=$(gh api "repos/$REPO_AUTORIZADO/pulls/$PR_NUMBER")
          if [ "$(jq -r .head.repo.full_name <<<"$json")" != "$REPO_AUTORIZADO" ]; then
            echo "::error::el PR $PR_NUMBER proviene de un fork: no se publica"; echo "habilitado=false" >> "$GITHUB_OUTPUT"; exit 1
          fi
          { echo "habilitado=true"; echo "head_sha=$(jq -r .head.sha <<<"$json")"; echo "etapa=$ETAPA"; } >> "$GITHUB_OUTPUT"

      - name: Matriz de la etapa
        id: matriz
        if: steps.tag.outputs.habilitado == 'true' || steps.dispatch.outputs.habilitado == 'true'
        env:
          ETAPA: ${{ steps.tag.outputs.etapa || steps.dispatch.outputs.etapa }}
        run: |
          set -euo pipefail
          case "$ETAPA" in
            backend)   m='[{"service":"backend","dockerfile":"Dockerfile.render"}]' ;;
            frontends) m='[{"service":"consola","dockerfile":"frontend/Dockerfile.preview"},{"service":"clientes","dockerfile":"frontend-client/Dockerfile.preview"}]' ;;
            *) echo "::error::etapa desconocida '$ETAPA'"; exit 1 ;;
          esac
          echo "matriz=$m" >> "$GITHUB_OUTPUT"

  build-push:
    name: publicar · ${{ matrix.service }}
    needs: guard
    if: needs.guard.outputs.habilitado == 'true' && needs.guard.outputs.head_sha != '' && needs.guard.outputs.matriz != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.guard.outputs.matriz) }}
    env:
      IMAGEN: ghcr.io/jcalupinia/auditbrain-preview-${{ matrix.service }}
      PAQUETE: auditbrain-preview-${{ matrix.service }}
      SHA: ${{ needs.guard.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.head_sha }}
      - name: El checkout es exactamente el commit autorizado
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          [ "$actual" = "$SHA" ] || { echo "::error::checkout $actual != $SHA"; exit 1; }
      - name: El destino es un paquete nuevo privado o uno ya privado (nunca un paquete público)
        env:
          GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pkg.json -w '%{http_code}' -H "Authorization: Bearer $GHCR_PUBLISH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/user/packages/container/$PAQUETE")
          if [ "$code" = "404" ]; then echo "paquete $PAQUETE inexistente: se creará con la credencial dedicada (nace privado)";
          elif [ "$code" = "200" ]; then vis=$(jq -r .visibility /tmp/pkg.json); [ "$vis" = "private" ] || { echo "::error::el paquete $PAQUETE ya existe y es '$vis': no se publica"; exit 1; }; echo "paquete $PAQUETE existente y privado";
          else echo "::error::no se pudo consultar el paquete $PAQUETE (HTTP $code)"; exit 1; fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_OWNER }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}
      - name: Construir y publicar con el commit exacto (una sola etiqueta sha-<sha>)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: ${{ env.IMAGEN }}:sha-${{ env.SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}
          build-args: |
            GIT_SHA=${{ env.SHA }}
          cache-from: type=gha,scope=preview-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=preview-${{ matrix.service }}
      - name: Verificación posterior — visibilidad PRIVATE y rechazo del acceso anónimo
        id: verifica
        env:
          GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pkg.json -w '%{http_code}' -H "Authorization: Bearer $GHCR_PUBLISH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/user/packages/container/$PAQUETE")
          [ "$code" = "200" ] || { echo "::error::no se pudo leer el paquete $PAQUETE tras publicar (HTTP $code)"; exit 1; }
          vis=$(jq -r .visibility /tmp/pkg.json)
          # Sonda anónima: token anónimo del registro y GET del manifiesto; un paquete privado responde 401/403/404.
          anon=$(curl -sS "https://ghcr.io/token?scope=repository:$GHCR_OWNER/$PAQUETE:pull" | jq -r '.token // empty')
          anon_code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $anon" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/$GHCR_OWNER/$PAQUETE/manifests/sha-$SHA")
          {
            echo "### $PAQUETE"
            echo "- imagen: \`$IMAGEN:sha-$SHA\`"
            echo "- commit: \`$SHA\`"
            echo "- digest: \`$DIGEST\`"
            echo "- visibilidad (API de GitHub Packages, credencial dedicada): **$vis**"
            echo "- descarga anónima del manifiesto: HTTP $anon_code"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "RESULTADO $PAQUETE sha=$SHA digest=$DIGEST visibilidad=$vis anonimo=HTTP_$anon_code"
          [ "$vis" = "private" ] || { echo "::error::EL PAQUETE $PAQUETE QUEDÓ '$vis' (no private). Detener: no publicar nada más; el propietario debe corregir la visibilidad."; exit 1; }
          [ "$anon_code" != "200" ] || { echo "::error::el manifiesto de $PAQUETE se descarga de forma anónima (HTTP 200). Detener."; exit 1; }
          echo "OK: $PAQUETE privado y sin acceso anónimo"
