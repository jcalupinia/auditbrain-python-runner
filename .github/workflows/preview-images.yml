name: preview-images

# Construye y PUBLICA en GHCR las tres imágenes de un Pull Request con el commit exacto
# (una sola etiqueta inmutable por imagen: sha-<sha completo>; sin `latest` ni alias).
#
# Dos caminos, ambos cerrados por defecto:
#
# 1) PUBLICACIÓN ÚNICA AUTORIZADA POR ETIQUETA (PR #384). Autorización administrativa del
#    2026-10-15: un `push` de una etiqueta `ghcr-preview-pr384-<sha de 40 caracteres>` publica las
#    imágenes de ESE commit si, y solo si, se cumple TODO lo siguiente (si no, termina sin publicar):
#      - el evento es un push de etiqueta y el repositorio es exactamente jcalupinia/auditbrain-python-runner;
#      - el nombre de la etiqueta termina en un SHA de 40 caracteres hexadecimales;
#      - la etiqueta apunta (desreferenciada por la API) exactamente a ese SHA;
#      - el PR #384 está abierto, sin fusionar, dirigido a main y no proviene de un fork;
#      - el HEAD actual del PR #384 es exactamente ese SHA.
#
# 2) workflow_dispatch: DESHABILITADO mientras la variable de repositorio PREVIEW_PIPELINE_ENABLED
#    no sea "true" (no existe hasta que haya aprobación administrativa independiente).
#
# Los paquetes GHCR deben ser PRIVADOS (decisión D11); el servidor de previews los leerá con una
# credencial de solo lectura que se creará más adelante (no en este workflow).

on:
  push:
    tags:
      - "ghcr-preview-pr384-*"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número del Pull Request cuyas imágenes se publican"
        required: true
        type: string

concurrency:
  group: preview-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REPO_AUTORIZADO: jcalupinia/auditbrain-python-runner
  PR_AUTORIZADO: "384"

jobs:
  guard:
    name: puerta de habilitación
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      habilitado: ${{ steps.tag.outputs.habilitado || steps.dispatch.outputs.habilitado || 'false' }}
      head_sha: ${{ steps.tag.outputs.head_sha || steps.dispatch.outputs.head_sha }}
    steps:
      - name: Puerta de la publicación única por etiqueta (PR 384)
        id: tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_REPO: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rechazar() { echo "::error::RECHAZADO sin publicar: $1"; echo "habilitado=false" >> "$GITHUB_OUTPUT"; exit 1; }
          [ "$EVENT_REPO" = "$REPO_AUTORIZADO" ] || rechazar "repositorio $EVENT_REPO distinto de $REPO_AUTORIZADO"
          [ "${GITHUB_REF_TYPE:-}" = "tag" ] || rechazar "el evento no es un push de etiqueta (${GITHUB_REF_TYPE:-?})"
          TAG="${GITHUB_REF_NAME}"
          PREFIJO="ghcr-preview-pr${PR_AUTORIZADO}-"
          case "$TAG" in "$PREFIJO"*) ;; *) rechazar "etiqueta $TAG sin el prefijo $PREFIJO" ;; esac
          SHA="${TAG#"$PREFIJO"}"
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || rechazar "la etiqueta no termina en un SHA de 40 caracteres hexadecimales"
          # La etiqueta debe apuntar exactamente al SHA de su nombre (si es anotada, se desreferencia).
          ref_json=$(gh api "repos/$REPO_AUTORIZADO/git/ref/tags/$TAG")
          obj_type=$(jq -r .object.type <<<"$ref_json"); obj_sha=$(jq -r .object.sha <<<"$ref_json")
          if [ "$obj_type" = "tag" ]; then commit=$(gh api "repos/$REPO_AUTORIZADO/git/tags/$obj_sha" --jq .object.sha); else commit="$obj_sha"; fi
          [ "$commit" = "$SHA" ] || rechazar "la etiqueta apunta a $commit, no al SHA de su nombre ($SHA)"
          echo "github.sha del evento: $EVENT_SHA (informativo; la referencia válida es la etiqueta desreferenciada)"
          # El PR autorizado debe estar abierto, sin fusionar, contra main, sin fork y con ese HEAD exacto.
          pr_json=$(gh api "repos/$REPO_AUTORIZADO/pulls/$PR_AUTORIZADO")
          [ "$(jq -r .state <<<"$pr_json")" = "open" ] || rechazar "el PR $PR_AUTORIZADO no está abierto"
          [ "$(jq -r .merged <<<"$pr_json")" = "false" ] || rechazar "el PR $PR_AUTORIZADO está fusionado"
          [ "$(jq -r .base.ref <<<"$pr_json")" = "main" ] || rechazar "el PR $PR_AUTORIZADO no apunta a main"
          [ "$(jq -r .head.repo.full_name <<<"$pr_json")" = "$REPO_AUTORIZADO" ] || rechazar "el PR $PR_AUTORIZADO proviene de un fork"
          head_sha=$(jq -r .head.sha <<<"$pr_json")
          [ "$head_sha" = "$SHA" ] || rechazar "el HEAD actual del PR ($head_sha) no es el SHA de la etiqueta ($SHA)"
          echo "AUTORIZADO: etiqueta $TAG -> commit $SHA = HEAD del PR $PR_AUTORIZADO"
          echo "habilitado=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Puerta de workflow_dispatch (deshabilitada sin PREVIEW_PIPELINE_ENABLED)
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ vars.PREVIEW_PIPELINE_ENABLED }}" != "true" ]; then
            echo "::notice::PREVIEW_PIPELINE_ENABLED no es 'true': no se publica nada"
            echo "habilitado=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ "$EVENT_REPO" = "$REPO_AUTORIZADO" ] || { echo "::error::repositorio no autorizado"; echo "habilitado=false" >> "$GITHUB_OUTPUT"; exit 1; }
          json=$(gh api "repos/$REPO_AUTORIZADO/pulls/$PR_NUMBER")
          if [ "$(jq -r .head.repo.full_name <<<"$json")" != "$REPO_AUTORIZADO" ]; then
            echo "::error::el PR $PR_NUMBER proviene de un fork: no se publica"; echo "habilitado=false" >> "$GITHUB_OUTPUT"; exit 1
          fi
          echo "habilitado=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r .head.sha <<<"$json")" >> "$GITHUB_OUTPUT"

  build-push:
    name: publicar · ${{ matrix.service }}
    needs: guard
    if: needs.guard.outputs.habilitado == 'true' && needs.guard.outputs.head_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: backend
            dockerfile: Dockerfile.render
          - service: consola
            dockerfile: frontend/Dockerfile.preview
          - service: clientes
            dockerfile: frontend-client/Dockerfile.preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.head_sha }}
      - name: El checkout es exactamente el commit autorizado
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          [ "$actual" = "${{ needs.guard.outputs.head_sha }}" ] || { echo "::error::checkout $actual != ${{ needs.guard.outputs.head_sha }}"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar con el commit exacto (una sola etiqueta sha-<sha>)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: ghcr.io/jcalupinia/auditbrain-${{ matrix.service }}:sha-${{ needs.guard.outputs.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.guard.outputs.head_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            GIT_SHA=${{ needs.guard.outputs.head_sha }}
          cache-from: type=gha,scope=preview-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=preview-${{ matrix.service }}
      - name: Resumen (imagen, commit y digest)
        run: |
          {
            echo "### auditbrain-${{ matrix.service }}"
            echo "- imagen: \`ghcr.io/jcalupinia/auditbrain-${{ matrix.service }}:sha-${{ needs.guard.outputs.head_sha }}\`"
            echo "- commit: \`${{ needs.guard.outputs.head_sha }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "DIGEST auditbrain-${{ matrix.service }} ${{ steps.build.outputs.digest }}"
